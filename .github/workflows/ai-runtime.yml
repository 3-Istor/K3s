name: AI runtime images

# Tag ai-runtime/vX.Y.Z publishes the three images with version X.Y.Z:
# ghcr.io/3-istor/cnp-gw-auth-proxy, cnp-run-python, cnp-sandbox-python.
on:
  push:
    branches: [main]
    paths: ["images/ai-runtime/**", ".github/workflows/ai-runtime.yml"]
    tags: ["ai-runtime/v*.*.*"]
  pull_request:
    paths: ["images/ai-runtime/**", ".github/workflows/ai-runtime.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: images/ai-runtime

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: images/ai-runtime/go.mod
          cache-dependency-path: images/ai-runtime/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...

  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s sandbox-image/tests -v

  image:
    needs: [go, sandbox]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: gw-auth-proxy, context: images/ai-runtime, file: images/ai-runtime/Dockerfile.gw-auth-proxy}
          - {image: run-python, context: images/ai-runtime, file: images/ai-runtime/Dockerfile.run-python}
          - {image: sandbox-python, context: images/ai-runtime/sandbox-image, file: images/ai-runtime/sandbox-image/Dockerfile}
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/ai-runtime/v') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Version
        id: version
        working-directory: .
        run: echo "version=${GITHUB_REF_NAME#ai-runtime/v}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: env.RELEASE == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on a release tag)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ env.RELEASE == 'true' }}
          tags: ghcr.io/3-istor/cnp-${{ matrix.image }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/3-Istor/K3s
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          platforms: linux/amd64

      - name: Generate SBOM
        if: env.RELEASE == 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/3-istor/cnp-${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.image }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: env.RELEASE == 'true'

      # Keyless: the certificate binds the signature to this workflow and tag
      # through the GitHub OIDC token, so there is no key to store or rotate.
      - name: Sign image and attest SBOM
        if: env.RELEASE == 'true'
        working-directory: .
        env:
          IMAGE: ghcr.io/3-istor/cnp-${{ matrix.image }}@${{ steps.build.outputs.digest }}
          SBOM: sbom-${{ matrix.image }}.cdx.json
        run: |
          cosign sign --yes "$IMAGE"
          cosign attest --yes --type cyclonedx --predicate "$SBOM" "$IMAGE"
