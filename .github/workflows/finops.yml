name: FinOps

on:
  push:
    branches: [main]
    paths: ["finops/**", "k8s/config/opencost/**", ".github/workflows/finops.yml"]
  pull_request:
    paths: ["finops/**", "k8s/config/opencost/**", ".github/workflows/finops.yml"]

jobs:
  tco:
    name: TCO and OpenCost pricing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: finops/go.mod
      - name: Test the TCO generator
        run: go -C finops test ./...
      - name: OpenCost pricing matches the TCO
        run: go -C finops run ./tco -check
