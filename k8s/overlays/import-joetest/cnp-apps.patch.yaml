- op: replace
  path: /spec/generators
  value:
  - matrix:
      generators:
      - git:
          repoURL: https://github.com/3-Istor/cnp-projects.git
          revision: main
          files:
          - path: registry/projects/*.yaml
          - path: registry/projects/joetest.yaml
            exclude: true
      - list:
          elementsYaml: "{{- $out := list -}}\n{{- range $app := dig \"apps\" (list)\
            \ .spec -}}\n  {{- $components := list \"app\" -}}\n  {{- if eq $app.type\
            \ \"fullstack\" -}}{{- $components = list \"frontend\" \"backend\" -}}{{-\
            \ end -}}\n  {{- $envs := dig \"environments\" (list \"prod\") $app -}}\n\
            \  {{- if hasKey $app \"sourceRevision\" -}}{{- $envs = list \"prod\"\
            \ -}}{{- end -}}\n  {{- $staged := has \"staging\" $envs -}}\n  {{- range\
            \ $env := $envs -}}\n    {{- range $c := $components -}}\n      {{- $out\
            \ = append $out (dict \"name\" $app.name \"type\" $app.type \"repoURL\"\
            \ $app.repoURL \"component\" $c \"env\" $env \"suffix\" (ternary \"\"\
            \ \"-stg\" (eq $env \"prod\")) \"staged\" $staged \"sourceRevision\" (dig\
            \ \"sourceRevision\" \"HEAD\" $app) \"chartRevision\" (dig \"chartRevision\"\
            \ \"HEAD\" $app) \"imageTag\" (dig \"imageTag\" \"\" $app) \"imageDigest\"\
            \ (dig \"imageDigest\" \"\" $app)) -}}\n    {{- end -}}\n  {{- end -}}\n\
            {{- end -}}\n{{ $out | toJson }}\n"
  - matrix:
      generators:
      - git:
          repoURL: https://github.com/3-Istor/cnp-projects.git
          revision: import-fichier-joe-raph
          files:
          - path: registry/projects/joetest.yaml
      - list:
          elementsYaml: "{{- $out := list -}}\n{{- range $app := dig \"apps\" (list)\
            \ .spec -}}\n  {{- $components := list \"app\" -}}\n  {{- if eq $app.type\
            \ \"fullstack\" -}}{{- $components = list \"frontend\" \"backend\" -}}{{-\
            \ end -}}\n  {{- $envs := dig \"environments\" (list \"prod\") $app -}}\n\
            \  {{- if hasKey $app \"sourceRevision\" -}}{{- $envs = list \"prod\"\
            \ -}}{{- end -}}\n  {{- $staged := has \"staging\" $envs -}}\n  {{- range\
            \ $env := $envs -}}\n    {{- range $c := $components -}}\n      {{- $out\
            \ = append $out (dict \"name\" $app.name \"type\" $app.type \"repoURL\"\
            \ $app.repoURL \"component\" $c \"env\" $env \"suffix\" (ternary \"\"\
            \ \"-stg\" (eq $env \"prod\")) \"staged\" $staged \"sourceRevision\" (dig\
            \ \"sourceRevision\" \"HEAD\" $app) \"chartRevision\" (dig \"chartRevision\"\
            \ \"HEAD\" $app) \"imageTag\" (dig \"imageTag\" \"\" $app) \"imageDigest\"\
            \ (dig \"imageDigest\" \"\" $app)) -}}\n    {{- end -}}\n  {{- end -}}\n\
            {{- end -}}\n{{ $out | toJson }}\n"
- op: add
  path: /metadata/annotations
  value:
    cnp.3istor.com/import-test-project: joetest
    cnp.3istor.com/import-test-registry: import-fichier-joe-raph
    cnp.3istor.com/import-test-k3s-revision: 77e9b381c4dbac554ae19b650f9489a06e77b074
