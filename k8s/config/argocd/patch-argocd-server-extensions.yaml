# Rollout tab in the Argo CD UI (argoproj-labs/rollout-extension). The release
# ships no checksum file, so the download is pinned by version only.
# IGNORE_FAILURE keeps argocd-server starting when GitHub is unreachable: the
# UI loses the tab, nothing else.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-server
spec:
  template:
    spec:
      initContainers:
        - name: rollout-extension
          image: quay.io/argoprojlabs/argocd-extension-installer:v1.1.0@sha256:6cc786ba4dc96ba81d5010fbf92adabef15aff89753a55e22b8d829cd8b6e2a8
          env:
            - name: EXTENSION_NAME
              value: rollout
            - name: EXTENSION_VERSION
              value: v0.4.0
            - name: EXTENSION_URL
              value: https://github.com/argoproj-labs/rollout-extension/releases/download/v0.4.0/extension.tar
            - name: IGNORE_FAILURE
              value: "true"
          volumeMounts:
            - name: extensions
              mountPath: /tmp/extensions/
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 32Mi
      containers:
        - name: argocd-server
          volumeMounts:
            - name: extensions
              mountPath: /tmp/extensions/
      volumes:
        - name: extensions
          emptyDir: {}
