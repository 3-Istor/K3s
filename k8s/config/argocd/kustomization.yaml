apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - namespace.yaml
  - github.com/argoproj/argo-cd/manifests/cluster-install?ref=v3.5.2
  - https://raw.githubusercontent.com/argoproj-labs/argocd-image-updater/refs/tags/v1.2.0/config/install.yaml
  - apps.yaml
  - secrets.yaml
  - servicemonitors.yaml
  - clusters/onprem.yaml
  # Add clusters/aws.yaml and clusters/gcp.yaml once kvv2/argocd/clusters/<cloud>
  # exists in Vault — the operator otherwise reconciles a missing path and
  # reports an error every cycle.
  - applicationset-projects.yaml
  - applicationset-apps.yaml

patches:
  - path: patch-argocd-cm.yaml
  - path: argocd-cmd-params-cm-patch.yaml
  - path: patch-argocd-rbac-cm.yaml

helmGlobals:
  chartHome: ../../../charts

helmCharts:
  - name: secure-route
    releaseName: argocd-routes
    namespace: argocd
    valuesFile: values-secure-route.yaml
