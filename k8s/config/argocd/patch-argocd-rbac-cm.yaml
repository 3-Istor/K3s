---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  labels:
    app.kubernetes.io/name: argocd-rbac-cm
    app.kubernetes.io/part-of: argocd
data:
  policy.default: "role:denied"
  scopes: "[groups]"
  policy.csv: |
    g, infra, role:admin
    g, member, role:readonly
    # The portal validates the user/project/repository before using this account.
    p, role:cmp-import, applicationsets, get, */cnp-apps, allow
    p, role:cmp-import, applicationsets, get, */cnp-image-updaters, allow
    p, role:cmp-import, applications, get, */*, allow
    p, role:cmp-import, repositories, get, *, allow
    p, role:cmp-import, repositories, create, *, allow
    g, cmp-import, role:cmp-import
