# GHCR pull secret for Image Updater on apps running on EKS/GKE, whose own
# app-registry secret is not on this cluster. Only the two GHCR keys are rendered.
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: cnp-cloud-app-registry
  namespace: argocd
spec:
  path: kvv2/arcl-cmp/credentials
  vaultRole: arcl-cmp-role
  type: kubernetes.io/dockerconfigjson
  keys:
    - github-registry-username
    - github-registry-token
  templates:
    .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{% printf "%s:%s" (index .Secrets "github-registry-username") (index .Secrets "github-registry-token") | b64enc %}"}}}'
