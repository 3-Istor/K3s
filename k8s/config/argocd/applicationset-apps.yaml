# Generates one Argo CD Application per application component, per project,
# from the Git registry.
#
# This replaces the kubernetes_manifest.argocd_application resources that the
# app-provision Terraform module creates today by writing straight into the API
# server (D-02). Five of the six objects that module creates are per-application
# and run on every single deploy; moving them to a generator removes a whole
# class of partial-apply failure modes.
#
# Two generators in the outer matrix — a git-files generator (one element per
# project record) times a list generator (one element per app component).
#
# This used to be a matrix nested inside a matrix (apps x components as two
# separate list generators). That is unsupported the way it was written: the
# inner list's elementsYaml tried to reference the sibling list's per-element
# .type field, and matrix generators do not thread parameters between two
# generators at the same nesting level that way — confirmed live against a
# throwaway registry record, "map has no entry for key \"type\"" on every
# project. The fix pre-flattens apps x components into one list, in Go
# template, before the matrix ever runs. sprig's dict/list/append build the
# array; toJson serializes it once, so there is no manual JSON-comma handling
# to get wrong.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cnp-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/3-Istor/cnp-projects.git
              revision: main
              files:
                - path: "registry/projects/*.yaml"
          - list:
              # A fullstack app renders a frontend and a backend, each with its
              # own values file and its own image; a static app renders one
              # component. Same split the Terraform module makes today.
              elementsYaml: |
                {{- $out := list -}}
                {{- range $app := dig "apps" (list) .spec -}}
                  {{- $components := list "app" -}}
                  {{- if eq $app.type "fullstack" -}}{{- $components = list "frontend" "backend" -}}{{- end -}}
                  {{- $envs := dig "environments" (list "prod") $app -}}
                  {{- if hasKey $app "sourceRevision" -}}{{- $envs = list "prod" -}}{{- end -}}
                  {{- $staged := has "staging" $envs -}}
                  {{- range $env := $envs -}}
                    {{- range $c := $components -}}
                      {{- $out = append $out (dict "name" $app.name "type" $app.type "repoURL" $app.repoURL "component" $c "env" $env "suffix" (ternary "" "-stg" (eq $env "prod")) "staged" $staged "sourceRevision" (dig "sourceRevision" "HEAD" $app) "chartRevision" (dig "chartRevision" "HEAD" $app) "imageTag" (dig "imageTag" "" $app) "imageDigest" (dig "imageDigest" "" $app)) -}}
                    {{- end -}}
                  {{- end -}}
                {{- end -}}
                {{ $out | toJson }}
  # An app that runs staging adds a per-environment values file on top of the
  # shared one: deploy/env/<env>/<component>.yaml, where the image lives (the
  # staging updater writes the staging one, a promotion from the CMP writes the
  # prod one). The patch replaces the whole sources list, so it repeats it.
  # Apps without staging get no patch and render exactly as before.
  templatePatch: |
    {{- if and .staged (not .imageDigest) }}
    spec:
      sources:
        - repoURL: https://github.com/3-Istor/infra-templates.git
          targetRevision: "{{ .chartRevision }}"
          path: .
          helm:
            # Imports keep the exact image scanned by the central pipeline.
            values: |
              {{- if .imageDigest }}
              image:
                tag: {{ printf "%s@%s" .imageTag .imageDigest | quote }}
              {{- else }}
              {}
              {{- end }}
            ignoreMissingValueFiles: true
            valueFiles:
              - '{{ if eq .type "fullstack" }}$values/deploy/values-{{ .component }}.yaml{{ else }}$values/deploy/values.yaml{{ end }}'
              - '$values/deploy/env/{{ .env }}/{{ .component }}.yaml'
        - repoURL: "{{ .repoURL }}"
          targetRevision: "{{ .sourceRevision }}"
          path: ""
          ref: values
    {{- end }}
  template:
    metadata:
      name: "{{ .metadata.name }}-{{ .name }}-{{ .component }}{{ .suffix }}"
      labels:
        cnp.3istor.com/project: "{{ .metadata.name }}"
        cnp.3istor.com/cloud: "{{ .spec.targetCloud }}"
        cnp.3istor.com/app: "{{ .name }}"
        cnp.3istor.com/env: "{{ .env }}"
      annotations:
        # Required for Kyverno compliance and to prevent sync-loops with
        # mutating webhooks.
        argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: "{{ .metadata.name }}"
      sources:
        - repoURL: https://github.com/3-Istor/infra-templates.git
          targetRevision: "{{ .chartRevision }}"
          path: .
          helm:
            # Imports keep the exact image scanned by the central pipeline.
            values: |
              {{- if .imageDigest }}
              image:
                tag: {{ printf "%s@%s" .imageTag .imageDigest | quote }}
              {{- else }}
              {}
              {{- end }}
            valueFiles:
              - '{{ if eq .type "fullstack" }}$values/deploy/values-{{ .component }}.yaml{{ else }}$values/deploy/values.yaml{{ end }}'
        - repoURL: "{{ .repoURL }}"
          targetRevision: "{{ .sourceRevision }}"
          path: ""
          ref: values
      destination:
        name: "{{ .spec.targetCloud }}"
        namespace: "{{ .metadata.name }}-{{ .name }}{{ .suffix }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        # No CreateNamespace: the namespace belongs to the project's bootstrap
        # Application (cnp-project-base templates/namespace.yaml), so it is
        # pruned when the app leaves the record. Until that sync lands, this
        # Application retries: automated sync never re-attempts a failed sync
        # of the same revision on its own.
        syncOptions:
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 10
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 1m
      ignoreDifferences:
        # Also what a Rollout's workloadRef does: it scales the Deployment to 0.
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
        # Offhours puts a canary app to sleep through its Rollout, which holds
        # the pods once it took the Deployment over.
        - group: argoproj.io
          kind: Rollout
          jsonPointers:
            - /spec/replicas
        # The Argo Rollouts gatewayAPI plugin moves the stable/canary weights
        # during a canary: rule 0 without stickiness, rule 2 behind the two
        # cookie rules. Exact pointers, not a jq path over every rule: with
        # RespectIgnoreDifferences a jq path into the rules array kept the
        # whole live array, so a route switching to canary never got its new
        # rules. A pointer missing from the live route is skipped.
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          jsonPointers:
            - /spec/rules/0/backendRefs/0/weight
            - /spec/rules/0/backendRefs/1/weight
            - /spec/rules/2/backendRefs/0/weight
            - /spec/rules/2/backendRefs/1/weight
        # Argo Rollouts pins the stable and canary Services to a pod hash.
        - group: ""
          kind: Service
          jsonPointers:
            - /spec/selector/rollouts-pod-template-hash
