# Generates one Argo CD Application per application component, per project,
# from the Git registry.
#
# This replaces the kubernetes_manifest.argocd_application resources that the
# app-provision Terraform module creates today by writing straight into the API
# server (D-02). Five of the six objects that module creates are per-application
# and run on every single deploy; moving them to a generator removes a whole
# class of partial-apply failure modes.
#
# Two generators in the outer matrix — a git-files generator (one element per
# project record) times a list generator (one element per app component).
#
# This used to be a matrix nested inside a matrix (apps x components as two
# separate list generators). That is unsupported the way it was written: the
# inner list's elementsYaml tried to reference the sibling list's per-element
# .type field, and matrix generators do not thread parameters between two
# generators at the same nesting level that way — confirmed live against a
# throwaway registry record, "map has no entry for key \"type\"" on every
# project. The fix pre-flattens apps x components into one list, in Go
# template, before the matrix ever runs. sprig's dict/list/append build the
# array; toJson serializes it once, so there is no manual JSON-comma handling
# to get wrong.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cnp-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/3-Istor/cnp-projects.git
              revision: main
              files:
                - path: "registry/projects/*.yaml"
          - list:
              # A fullstack app renders a frontend and a backend, each with its
              # own values file and its own image; a static app renders one
              # component. Same split the Terraform module makes today.
              elementsYaml: |
                {{- $out := list -}}
                {{- range $app := dig "apps" (list) .spec -}}
                  {{- $components := list "app" -}}
                  {{- if eq $app.type "fullstack" -}}{{- $components = list "frontend" "backend" -}}{{- end -}}
                  {{- range $c := $components -}}
                    {{- $out = append $out (dict "name" $app.name "type" $app.type "repoURL" $app.repoURL "component" $c) -}}
                  {{- end -}}
                {{- end -}}
                {{ $out | toJson }}
  template:
    metadata:
      name: "{{ .metadata.name }}-{{ .name }}-{{ .component }}"
      labels:
        cnp.3istor.com/project: "{{ .metadata.name }}"
        cnp.3istor.com/cloud: "{{ .spec.targetCloud }}"
        cnp.3istor.com/app: "{{ .name }}"
      annotations:
        # Required for Kyverno compliance and to prevent sync-loops with
        # mutating webhooks.
        argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: "{{ .metadata.name }}"
      sources:
        - repoURL: https://github.com/3-Istor/infra-templates.git
          targetRevision: HEAD
          path: .
          helm:
            valueFiles:
              - '{{ if eq .type "fullstack" }}$values/deploy/values-{{ .component }}.yaml{{ else }}$values/deploy/values.yaml{{ end }}'
        - repoURL: "{{ .repoURL }}"
          targetRevision: HEAD
          path: ""
          ref: values
      destination:
        name: "{{ .spec.targetCloud }}"
        namespace: "{{ .metadata.name }}-{{ .name }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
