# Argo CD cluster registration for AWS. The Vault entry is written by Terraform
# (Cloud repo, module cluster-addons) on every up and kept on down.
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: cluster-aws
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    cnp.3istor.com/cloud: aws
spec:
  path: kvv2/argocd/clusters/aws
  vaultRole: argocd-role
  type: Opaque
  keys:
    - name
    - server
    - config
