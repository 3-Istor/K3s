# Global rate limit service (envoyproxy/ratelimit) and its Redis. Domain
# ai-budget:
#   - azp: daily token budget per caller, UTC day; the limit of each caller
#     comes from its project's policy (limitOverride, cnp-ai-policies);
#   - platform=all: cumulative spend in micro-USD. The gateway refuses once it
#     is reached; budget-guard turns that into a readable 429 and the alerts.
#     Keep requests_per_unit = CAP_USD of budget-guard x 1 000 000.
# The config is ratelimit/config.yaml (hashed name: a change rolls the pods).
# AOF on a PVC: the counters (budgets, platform spend) survive a restart.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ratelimit-redis
  labels: &labels
    app.kubernetes.io/name: ratelimit-redis
spec:
  serviceName: ratelimit-redis
  replicas: 1
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: docker.io/library/redis:8.10.3-alpine
          args:
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --save
            - ""
            - --dir
            - /data
            - --maxmemory
            - 96mb
            - --maxmemory-policy
            - noeviction
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: ceph-rbd
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ratelimit-redis
spec:
  selector:
    app.kubernetes.io/name: ratelimit-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ratelimit
  labels: &labels
    app.kubernetes.io/name: ratelimit
spec:
  replicas: 2
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ratelimit
          image: docker.io/envoyproxy/ratelimit:a7a61514
          command: [/bin/ratelimit]
          env:
            - {name: REDIS_SOCKET_TYPE, value: tcp}
            - {name: REDIS_URL, value: "ratelimit-redis:6379"}
            - {name: RUNTIME_ROOT, value: /data}
            - {name: RUNTIME_SUBDIRECTORY, value: ratelimit}
            - {name: RUNTIME_WATCH_ROOT, value: "false"}
            - {name: USE_STATSD, value: "false"}
            - {name: LOG_LEVEL, value: warn}
            - {name: LOG_FORMAT, value: json}
          ports:
            - name: grpc
              containerPort: 8081
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /data/ratelimit/config/config.yaml
              subPath: config.yaml
      volumes:
        - name: config
          configMap:
            name: ratelimit-config
---
apiVersion: v1
kind: Service
metadata:
  name: ratelimit
spec:
  selector:
    app.kubernetes.io/name: ratelimit
  ports:
    - name: grpc
      port: 8081
      targetPort: grpc
