# Every project's Keycloak lives in this cluster, so its backups outlive an
# accidental delete of the Argo app: Retain keeps the bucket.
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: cnp-projects-keycloak-backup
spec:
  bucketName: cnpg-cnp-projects-keycloak
  storageClassName: ceph-bucket-retain
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: cnp-projects-keycloak-backup
spec:
  retentionPolicy: "14d"
  configuration:
    destinationPath: "s3://cnpg-cnp-projects-keycloak/"
    endpointURL: "http://192.168.1.110:7480"
    s3Credentials:
      accessKeyId:
        name: cnp-projects-keycloak-backup
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: cnp-projects-keycloak-backup
        key: AWS_SECRET_ACCESS_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: cnp-projects-keycloak-daily
spec:
  # Cron with seconds. 02:00, an hour before the app databases.
  schedule: "0 0 2 * * *"
  backupOwnerReference: self
  cluster:
    name: cnp-projects-keycloak
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
