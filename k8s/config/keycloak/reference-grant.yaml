apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-envoy-oidc
  namespace: keycloak
spec:
  from:
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: demo-app
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: argocd
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: arcl-cmp
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: mepa-app
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: qcm
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: offhours-guard
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: observability
  to:
    - group: ""
      kind: Service
      name: keycloakx-http
---
# The AI gateway fetches the realm's JWKS in-cluster (ai-gateway, cnp-ai-policies).
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-ai-gateway-jwks
  namespace: keycloak
spec:
  from:
    - group: agentgateway.dev
      kind: AgentgatewayPolicy
      namespace: ai-gateway
  to:
    - group: ""
      kind: Service
      name: keycloakx-http
