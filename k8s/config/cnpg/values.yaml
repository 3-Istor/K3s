type: postgresql
mode: standalone
version:
  postgresql: "16"
cluster:
  instances: 1
backups:
  enabled: false

## Config pour plus tard backup sur bucket s3 ##
# backups:
#   provider: s3
#   s3:
#     region: "eu-west-1"
#     bucket: "db-backups"
#     path: "/v1-restore"
#     accessKey: "AWS_S3_ACCESS_KEY"
#     secretKey: "AWS_S3_SECRET_KEY"
#   scheduledBackups:
#     - name: daily-backup # Daily at midnight
#       schedule: "0 0 0 * * *" # Daily at midnight
#       backupOwnerReference: self
#   retentionPolicy: "30d"

monitoring:
  podMonitorEnabled: true

# Operator chart (the keys above belong to the cluster chart and are ignored).
# A 60s lease rides out the few-second etcd stalls of the server VM; with the
# 15s default the operator lost its lease and exited every few hours.
additionalArgs:
  - --leader-lease-duration=60
  - --leader-renew-deadline=45
