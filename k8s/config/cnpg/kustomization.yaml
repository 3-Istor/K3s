apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cnpg-system

resources:
  - namespace.yaml
helmGlobals:
  chartHome: ../../../charts

helmCharts:
  - name: cloudnative-pg
    repo: https://cloudnative-pg.github.io/charts
    version: "0.29.0"
    releaseName: cnpg
    namespace: cnpg-system
    valuesFile: values.yaml
  # Backups through the CNPG-I plugin: the in-tree barmanObjectStore is
  # deprecated since CNPG 1.26.
  - name: plugin-barman-cloud
    repo: https://cloudnative-pg.github.io/charts
    version: "0.8.1"
    releaseName: barman-cloud
    namespace: cnpg-system
    valuesFile: values-barman-cloud.yaml
