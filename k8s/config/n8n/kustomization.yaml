apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: n8n

resources:
  - namespace.yaml
  - secrets.yaml
  - postgres.yaml
  # - offhours-guard.yaml

helmGlobals:
  chartHome: ../../../charts

helmCharts:
  - name: n8n
    repo: oci://8gears.container-registry.com/library
    version: "2.0.1"
    releaseName: n8n
    namespace: n8n
    valuesFile: values.yaml

  - name: secure-route
    releaseName: n8n-routes
    namespace: n8n
    valuesFile: values-secure-route.yaml

# kustomize ignores helm.sh/hook, so this test Pod would be applied by ArgoCD as
# a permanent workload. The chart offers no flag to disable it.
patches:
  - target:
      kind: Pod
      name: n8n-test-connection
    patch: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: n8n-test-connection
      $patch: delete
