apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rook-ceph

resources:
  - namespace.yaml
  - secrets.yaml
  - configmaps.yaml
  - storageclass.yaml
  - object-store.yaml

helmGlobals:
  chartHome: ../../../charts

helmCharts:
  - name: rook-ceph
    repo: https://charts.rook.io/release
    version: 1.21.2
    releaseName: rook-ceph
    namespace: rook-ceph
    includeCRDs: true
    # The chart asks 200m; the operator of an external cluster idles at ~12m.
    valuesInline:
      resources:
        requests:
          cpu: 50m
          memory: 192Mi
        limits:
          memory: 512Mi

  - name: ceph-csi-drivers
    repo: https://ceph.github.io/ceph-csi-operator
    version: 1.1.0
    releaseName: ceph-csi-drivers
    namespace: rook-ceph
    valuesFile: csi-drivers-values.yaml

  - name: rook-ceph-cluster
    repo: https://charts.rook.io/release
    version: 1.21.2
    releaseName: rook-ceph-external
    namespace: rook-ceph
    valuesFile: values-external-cluster.yaml
