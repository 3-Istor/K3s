apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: rook-ceph-mon
  namespace: rook-ceph
spec:
  path: kvv2/rook-ceph/mon-secret
  vaultRole: rook-ceph-role
  type: Opaque
  keys:
    - cluster-name
    - fsid
    - admin-secret
    - mon-secret
    - ceph-username
    - ceph-secret
---
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: rook-csi-rbd-node
  namespace: rook-ceph
spec:
  path: kvv2/rook-ceph/csi-node
  vaultRole: rook-ceph-role
  type: Opaque
  keys:
    - userID
    - userKey
---
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: rook-csi-rbd-provisioner
  namespace: rook-ceph
spec:
  path: kvv2/rook-ceph/csi-provisioner
  vaultRole: rook-ceph-role
  type: Opaque
  keys:
    - userID
    - userKey
---
# Rook manages buckets and their users on the external RGW through this
# admin-ops user (created with radosgw-admin on the Ceph cluster).
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: rgw-admin-ops-user
  namespace: rook-ceph
spec:
  path: kvv2/rook-ceph/rgw-admin-ops-user
  vaultRole: rook-ceph-role
  type: Opaque
  keys:
    - accessKey
    - secretKey
