apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: envoy-gateway-system

resources:
  - namespace.yaml

helmCharts:
  # - name: envoy-gateway-system
  #   repo: oci://docker.io/envoyproxy/gateway-crds-helm
  #   version: v1.7.1
  #   releaseName: envoy-gateway-system
  #   namespace: envoy-gateway-system
  #   valuesFile: values.yaml

  - name: gateway-helm
    repo: oci://docker.io/envoyproxy
    version: 1.10.0
    releaseName: envoy-gateway-system
    namespace: envoy-gateway-system
    # valuesFile: values.yaml
    includeCRDs: true
    # The controller uses ~5m and ~115Mi; the chart asks 100m and 256Mi.
    valuesInline:
      # A 60s lease rides out the few-second etcd stalls of the server VM; the
      # 15s default lost the lease, and restarted the controller, every few hours.
      config:
        envoyGateway:
          provider:
            kubernetes:
              leaderElection:
                leaseDuration: 60s
                renewDeadline: 45s
                retryPeriod: 10s
      deployment:
        envoyGateway:
          resources:
            requests:
              cpu: 25m
              memory: 160Mi
            limits:
              memory: 1024Mi
