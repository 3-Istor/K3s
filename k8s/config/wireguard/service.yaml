# On-prem pods reach the AWS service through aws-apps.wireguard.svc.cluster.local:18081
apiVersion: v1
kind: Service
metadata:
  name: aws-apps
  namespace: wireguard
spec:
  selector:
    app: wireguard
  ports:
    - name: onprem-to-cloud
      port: 18081
      targetPort: 18081
      protocol: TCP
---
# On-prem pods reach the GCP service through gcp-apps.wireguard.svc.cluster.local:18081
apiVersion: v1
kind: Service
metadata:
  name: gcp-apps
  namespace: wireguard
spec:
  selector:
    app: wireguard-gcp
  ports:
    - name: onprem-to-cloud
      port: 18081
      targetPort: 18081
      protocol: TCP
