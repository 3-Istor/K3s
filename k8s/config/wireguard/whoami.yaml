# Test target for the aws-to-onprem flow
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: wireguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: whoami
          image: traefik/whoami:v1.12.0
          args: ["--port", "8080"]
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: wireguard
spec:
  selector:
    app: whoami
  ports:
    - name: http
      port: 80
      targetPort: 8080
