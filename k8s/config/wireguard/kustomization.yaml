apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: wireguard

resources:
  - namespace.yaml
  - secrets.yaml
  - deployment.yaml
  - service.yaml
  - whoami.yaml

# Generated names carry a content hash: editing settings.env or onprem.sh
# rolls the Deployment automatically
configMapGenerator:
  - name: wireguard-settings
    envs:
      - settings.env
  - name: wireguard-scripts
    files:
      - onprem.sh
