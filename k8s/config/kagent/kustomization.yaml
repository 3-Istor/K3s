apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kagent

resources:
  - namespace.yaml
  - agent-network.yaml

# kagent 0.10.6 (kmcp embedded, Go ADK). kagent 1.x needs Kubernetes >= 1.37.
helmCharts:
  - name: kagent-crds
    repo: oci://ghcr.io/kagent-dev/kagent/helm
    version: 0.10.6
    releaseName: kagent-crds
    namespace: kagent
  - name: kagent
    repo: oci://ghcr.io/kagent-dev/kagent/helm
    version: 0.10.6
    releaseName: kagent
    namespace: kagent
    valuesFile: values.yaml
