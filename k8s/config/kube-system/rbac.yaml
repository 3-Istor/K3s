# ---------------------------------------------------------
# 1. ADMINS: cluster-admin, just in time (CNP-124)
# ---------------------------------------------------------
# Nobody is in elevated-k3s-admin at rest: the CMP adds a platform admin for
# the length of an approved grant. Break-glass when the CMP or Keycloak is
# down: see "Just-in-time access and break-glass" in the README.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-admin-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: Group
    name: "oidc:elevated-k3s-admin"

---
# ---------------------------------------------------------
# 2. PLATFORM ADMINS: read-only across the cluster, standing
# ---------------------------------------------------------
# The view ClusterRole excludes Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-view-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: Group
    name: "oidc:infra"
