# Default 2, but need to ask for this kind of thing what's the real needs for HA or is ok ? because it's an operator
operator:
  replicas: 1

# Bare-Metal Setup (e.g., Talos etc.)
# ipam:
#   mode: kubernetes

kubeProxyReplacement: true

k8sServiceHost: "192.168.1.212"
k8sServicePort: 6443

socketLB:
  # Mandatory with kube proxy replacement if we want to use kata containers
  # See
  hostNamespaceOnly: true

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

# Talos Requirement
# cgroup:
#   autoMount:
#     enabled: false
#   hostRoot: /sys/fs/cgroup

# Talos Service Port
# k8sServiceHost: localhost
# k8sServicePort: 7445

gatewayAPI:
  enabled: false

l7Proxy: true # default true

# This require to add Envoy-related CRDs
envoyConfig:
  enabled: false

# Flows denied by a network policy, written to the agent's own log so Alloy
# ships them to Loki with everything else. Measured before enabling: zero
# policy denials over the agents' flow buffers, so the volume is small.
hubble:
  export:
    static:
      enabled: true
      filePath: stdout
      allowList:
        - '{"verdict":["DROPPED"],"drop_reason_desc":["POLICY_DENIED"]}'
      fieldMask:
        - time
        - source.namespace
        - source.pod_name
        - destination.namespace
        - destination.pod_name
        - IP
        - l4
        - verdict
        - drop_reason_desc
        - traffic_direction
