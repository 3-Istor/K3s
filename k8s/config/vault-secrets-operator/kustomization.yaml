apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vault-secrets-operator

resources:
  - namespace.yaml

helmCharts:
  - name: vault-secrets-operator
    repo: oci://ghcr.io/ricoberger/charts
    version: 3.0.0
    releaseName: vault-secrets-operator
    namespace: vault-secrets-operator
    valuesFile: vso-values.yaml

# kustomize ignores helm.sh/hook, so this test Pod would be applied by ArgoCD as
# a permanent workload. The chart offers no flag to disable it.
patches:
  - target:
      kind: Pod
      name: vault-secrets-operator-test-connection
    patch: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: vault-secrets-operator-test-connection
      $patch: delete
