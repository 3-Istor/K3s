# Doc: https://github.com/ricoberger/vault-secrets-operator/blob/main/charts/README.md
# Values: https://github.com/ricoberger/vault-secrets-operator/blob/main/charts/vault-secrets-operator/values.yaml

replicaCount: 1

image:
  repository: ghcr.io/ricoberger/vault-secrets-operator
  tag: v1.26.0
  pullPolicy: IfNotPresent

vault:
  authMethod: kubernetes
  # Every VaultSecret with a vaultRole logs in again on each reconcile (no
  # client reuse, no token revoke). At 60s, 111 secrets kept the operator
  # looping and Vault doing ~11 raft writes/s on the etcd VM's disk.
  reconciliationTime: 600
  address: http://vault.vault.svc.cluster.local:8200
  kubernetesRole: "vault-secrets-operator-role"

resources:
  limits:
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 128Mi
