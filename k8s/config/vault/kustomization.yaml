apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vault

resources:
  - namespace.yaml

helmGlobals:
  chartHome: ../../../charts

helmCharts:
  - name: vault
    repo: https://helm.releases.hashicorp.com
    version: 0.34.1
    releaseName: vault
    namespace: vault
    valuesFile: vault-values.yaml

  - name: secure-route
    releaseName: vault-routes
    namespace: vault
    valuesFile: values-secure-route.yaml

# kustomize ignores helm.sh/hook, so this test Pod would be applied by ArgoCD as
# a permanent workload. The chart offers no flag to disable it.
patches:
  - target:
      kind: Pod
      name: vault-server-test
    patch: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: vault-server-test
      $patch: delete
