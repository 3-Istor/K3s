# https://github.com/hashicorp/vault-helm/blob/main/values.yaml
global:
  enabled: true
  tlsDisable: true
  namespace: "vault"

  injector:
    enabled: false

server:
  standalone:
    enabled: true
    config: |
      ui = true

      listener "tcp" {
        address = "[::]:8200"
        cluster_address = "[::]:8201"
        tls_disable = 1
      }
      storage "raft" {
        path = "/vault/data"
      }

  # Vault sat at 218Mi of a 256Mi limit while sealed and freshly restarted, and
  # was OOMKilled 14 times. Every OOM re-seals it, which freezes all 39
  # VaultSecret resources cluster-wide until someone unseals it by hand.
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "250m"

  dataStorage:
    enabled: true
    storageClass: "local-path"
    size: 2Gi

  auditStorage:
    enabled: true
    storageClass: "local-path"
    size: 2Gi

  ingress:
    enabled: false
