apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # agent-sandbox v1.0.12 (API v1beta1), controller with the extensions
  # (SandboxTemplate, SandboxClaim, SandboxWarmPool).
  - https://github.com/kubernetes-sigs/agent-sandbox/releases/download/v1.0.12/sandbox-with-extensions.yaml
  - namespace.yaml
  - templates.yaml

patches:
  - target:
      kind: Deployment
      name: agent-sandbox-controller
      namespace: agent-sandbox-system
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests: {cpu: 20m, memory: 64Mi}
          limits: {memory: 256Mi}
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          capabilities: {drop: [ALL]}
          seccompProfile: {type: RuntimeDefault}
      - op: add
        path: /spec/template/spec/containers/0/livenessProbe
        value: {httpGet: {path: /healthz, port: healthz}, periodSeconds: 20}
      - op: add
        path: /spec/template/spec/containers/0/readinessProbe
        value: {httpGet: {path: /readyz, port: healthz}, periodSeconds: 10}
