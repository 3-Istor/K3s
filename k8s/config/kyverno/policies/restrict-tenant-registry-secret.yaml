# app-registry holds the org-wide GHCR token: kubelet may use it to pull, a
# tenant container must never read it (CNP-294). imagePullSecrets stays
# allowed. Audit first, then switch validationActions to [Deny].

apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-tenant-registry-secret
spec:
  validationActions:
    - Audit
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: cnp.3istor.com/project
          operator: Exists
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
  variables:
    - name: secret
      expression: "'app-registry'"
    - name: containers
      expression: >-
        object.spec.containers
          + object.spec.?initContainers.orValue([])
          + object.spec.?ephemeralContainers.orValue([])
    - name: volumes
      expression: object.spec.?volumes.orValue([])
  validations:
    - message: "The app-registry secret may only appear in imagePullSecrets, not in a volume."
      expression: >-
        variables.volumes.all(v,
          v.?secret.secretName.orValue('') != variables.secret
          && v.?projected.sources.orValue([]).all(s,
               s.?secret.name.orValue('') != variables.secret))
    - message: "The app-registry secret may only appear in imagePullSecrets, not in env or envFrom."
      expression: >-
        variables.containers.all(c,
          c.?env.orValue([]).all(e,
            e.?valueFrom.secretKeyRef.name.orValue('') != variables.secret)
          && c.?envFrom.orValue([]).all(e,
            e.?secretRef.name.orValue('') != variables.secret))
