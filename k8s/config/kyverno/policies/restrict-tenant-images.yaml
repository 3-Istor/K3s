# A tenant pod may run any public image, but org images only from its own
# project (CNP-294): ghcr.io/3-istor holds private images that every node can
# pull, so without this a tenant could run another project's code and read
# what is baked into it. Deny since 2026-11-20 (0 violations in Audit), before
# the nodes pull through Zot, which serves private org images to any pod.
#
# Own images, from the namespace <project>-<app>[-stg]:
#   ghcr.io/3-istor/imports/<project>/...   imported apps (CMP IMPORT_IMAGE_PREFIX)
#   ghcr.io/3-istor/<app> and <app>/...      template apps, pushed by the app's
#                                            own repo, named after the app
# Template images carry no project segment: the app name stands for it, and
# GitHub keeps repo names unique within the org. "imports" is refused as an
# app name so a template namespace cannot claim every imported image.
#
# One platform image any tenant runs, that exact repository only, and only
# signed (ImageValidatingPolicy verify-gw-auth-proxy-signature, Deny):
#   ghcr.io/3-istor/cnp-gw-auth-proxy        sidecar of every AI agent
#
# In-cluster registries are refused: Zot (10.43.0.50) mirrors ghcr.io with
# the org's pull token, so addressing it directly would skip the org check.

apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-tenant-images
spec:
  validationActions:
    - Deny
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: cnp.3istor.com/project
          operator: Exists
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
  variables:
    - name: project
      expression: namespaceObject.metadata.labels['cnp.3istor.com/project']
    - name: appAndEnv
      expression: >-
        namespaceObject.metadata.name.startsWith(variables.project + '-')
          ? namespaceObject.metadata.name.substring(size(variables.project) + 1)
          : ''
    - name: app
      expression: >-
        variables.appAndEnv.endsWith('-stg')
          ? variables.appAndEnv.substring(0, size(variables.appAndEnv) - 4)
          : variables.appAndEnv
    - name: images
      expression: >-
        (object.spec.containers
          + object.spec.?initContainers.orValue([])
          + object.spec.?ephemeralContainers.orValue([])).map(c, c.image)
    # Repository without tag or digest, lower-cased, with Docker Hub short
    # names expanded the way containerd resolves them ("redis" is
    # docker.io/library/redis) and the registry port dropped, so neither
    # GHCR.io nor ghcr.io:443 slips past the org check.
    - name: fullRepositories
      expression: >-
        variables.images.map(i, i.lowerAscii().split('@')[0]).map(i,
          i.substring(0, i.lastIndexOf('/') + 1)
            + i.substring(i.lastIndexOf('/') + 1).split(':')[0]
        ).map(r,
          !r.contains('/') ? 'docker.io/library/' + r
          : (r.split('/')[0].contains('.') || r.split('/')[0].contains(':') || r.split('/')[0] == 'localhost') ? r
          : 'docker.io/' + r)
    - name: repositories
      expression: >-
        variables.fullRepositories.map(r,
          r.split('/')[0].split(':')[0] + r.substring(r.indexOf('/')))
    - name: hosts
      expression: variables.repositories.map(r, r.split('/')[0])
  validations:
    - messageExpression: >-
        'Images from ghcr.io/3-istor must be this project\'s own: ghcr.io/3-istor/imports/'
        + variables.project + '/'
        + (variables.app != '' && variables.app != 'imports' ? ' or ghcr.io/3-istor/' + variables.app : '')
        + '; got: ' + variables.images.join(', ')
      expression: >-
        variables.repositories.all(r,
          !r.startsWith('ghcr.io/3-istor/')
          || r == 'ghcr.io/3-istor/cnp-gw-auth-proxy'
          || r.startsWith('ghcr.io/3-istor/imports/' + variables.project + '/')
          || (variables.app != '' && variables.app != 'imports'
              && (r == 'ghcr.io/3-istor/' + variables.app
                  || r.startsWith('ghcr.io/3-istor/' + variables.app + '/'))))
    - messageExpression: >-
        'Images must come from a public registry, not an in-cluster one; got: '
        + variables.images.join(', ')
      expression: >-
        variables.hosts.all(h,
          h != 'localhost'
          && !h.endsWith('.svc') && !h.contains('.svc.') && !h.endsWith('.local')
          && !h.matches('^[0-9.]+$') && !h.startsWith('['))
