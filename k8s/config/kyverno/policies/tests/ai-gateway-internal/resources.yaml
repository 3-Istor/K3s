apiVersion: v1
kind: Service
metadata:
  name: ai-gateway
  namespace: ai-gateway
spec:
  type: ClusterIP
  ports: [{port: 8080}]
---
apiVersion: v1
kind: Service
metadata:
  name: public-lb
  namespace: epitweet
spec:
  type: LoadBalancer
  ports: [{port: 80}]
---
apiVersion: v1
kind: Service
metadata:
  name: exposed
  namespace: ai-gateway
spec:
  type: NodePort
  ports: [{port: 8080}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-epitweet
  namespace: ai-gateway
spec:
  parentRefs: [{name: ai-gateway}]
  rules:
    - backendRefs: [{group: agentgateway.dev, kind: AgentgatewayBackend, name: anthropic}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend
  namespace: epitweet
spec:
  parentRefs: [{name: epitweet-gateway, namespace: epitweet-system}]
  rules:
    - backendRefs: [{name: frontend, port: 80}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: on-public-gateway
  namespace: ai-gateway
spec:
  parentRefs: [{name: shared-gateway, namespace: gateway-infra}]
  rules:
    - backendRefs: [{name: ai-gateway, port: 8080}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: expose-ai-gateway
  namespace: epitweet
spec:
  parentRefs: [{name: epitweet-gateway, namespace: epitweet-system}]
  rules:
    - backendRefs: [{name: ai-gateway, namespace: ai-gateway, port: 8080}]
