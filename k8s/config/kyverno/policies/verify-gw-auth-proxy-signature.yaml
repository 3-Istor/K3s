# The AI agent sidecar is the one org image restrict-tenant-images lets every
# tenant run. In exchange it must be the platform's build: a cosign keyless
# signature from the K3s ai-runtime workflow on an ai-runtime/v* tag. Deny and
# fail closed, in tenant namespaces only: an unsigned or unverifiable sidecar
# never starts.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-gw-auth-proxy-signature
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  validationActions:
    - Deny
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: cnp.3istor.com/project
          operator: Exists
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchImageReferences:
    - glob: "ghcr.io/3-istor/cnp-gw-auth-proxy:*"
    - glob: "ghcr.io/3-istor/cnp-gw-auth-proxy@*"
  validationConfigurations:
    mutateDigest: false
    verifyDigest: false
    required: true
  attestors:
    - name: aiRuntimeRelease
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subjectRegExp: '^https://github\.com/3-Istor/K3s/\.github/workflows/ai-runtime\.yml@refs/tags/ai-runtime/v.+$'
  validations:
    - message: "ghcr.io/3-istor/cnp-gw-auth-proxy must carry the cosign keyless signature of the K3s ai-runtime workflow on an ai-runtime/v* tag."
      expression: >-
        (images.containers + images.initContainers)
          .filter(image, image.startsWith("ghcr.io/3-istor/cnp-gw-auth-proxy"))
          .all(image, verifyImageSignatures(image, [attestors.aiRuntimeRelease]) > 0)
