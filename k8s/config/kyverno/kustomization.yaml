apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kyverno

resources:
  - policies/
  - namespace.yaml

helmCharts:
  - name: kyverno
    repo: https://kyverno.github.io/kyverno/
    version: 3.8.2
    releaseName: kyverno
    namespace: kyverno
    valuesFile: values.yaml
    includeCRDs: true

# The chart gates its Helm test pods on the controllers being enabled, with no
# flag of its own. kustomize ignores helm.sh/hook, so without this they would be
# applied by ArgoCD as permanent Pods.
patches:
  - target:
      kind: Pod
      labelSelector: "app.kubernetes.io/component=test"
    patch: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: ignored
      $patch: delete
