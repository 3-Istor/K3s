# Read credentials for ImageValidatingPolicy signature checks on private GHCR
# images. Cluster-scoped policies resolve spec.credentials.secrets in the
# Kyverno namespace only. Same Vault source as argocd/cnp-cloud-app-registry.
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: ghcr-read
  namespace: kyverno
spec:
  path: kvv2/arcl-cmp/credentials
  vaultRole: arcl-cmp-role
  type: kubernetes.io/dockerconfigjson
  keys:
    - github-registry-username
    - github-registry-token
  templates:
    .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{% printf "%s:%s" (index .Secrets "github-registry-username") (index .Secrets "github-registry-token") | b64enc %}"}}}'
