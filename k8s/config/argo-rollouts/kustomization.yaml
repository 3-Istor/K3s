apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - gateway-api-rbac.yaml
  - analysis-templates.yaml

helmCharts:
  - name: argo-rollouts
    repo: https://argoproj.github.io/argo-helm
    version: 2.43.8
    releaseName: argo-rollouts
    namespace: argo-rollouts
    valuesFile: values.yaml
    includeCRDs: true

# Deleting or pruning the CRDs would delete every tenant Rollout with them.
# Argo CD ignores the chart's helm.sh/resource-policy: keep.
patches:
  - target:
      kind: CustomResourceDefinition
    patch: |
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: ignored
        annotations:
          argocd.argoproj.io/sync-options: Delete=false
