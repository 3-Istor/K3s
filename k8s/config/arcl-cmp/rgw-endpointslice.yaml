# Not in kustomization.yaml: Argo CD excludes EndpointSlices. Apply by hand:
#   kubectl -n arcl-cmp apply -f k8s/config/arcl-cmp/rgw-endpointslice.yaml
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: rgw
  namespace: arcl-cmp
  labels:
    kubernetes.io/service-name: rgw
addressType: IPv4
ports:
  - name: http
    port: 7480
    protocol: TCP
endpoints:
  - addresses: ["192.168.1.110"]
