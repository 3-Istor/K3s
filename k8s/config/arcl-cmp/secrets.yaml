apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: arcl-cmp-secret
  namespace: arcl-cmp
spec:
  path: kvv2/arcl-cmp/credentials
  vaultRole: arcl-cmp-role
  type: Opaque
  keys:
    - os-auth-url
    - os-username
    - os-password
    - os-project-name
    - os-user-domain-name
    - os-project-domain-name
    - os-endpoint-type
    - aws-region
    - aws-s3-bucket
    - aws-s3-key-prefix
    - cloudflare-api-token
    - cloudflare-zone-id
    - discord-webhook-url
    - security-discord-webhook-url
    - cloudflare-account-id
    - github-app-id
    - github-app-private-key
    - github-installation-id
    - github-registry-username
    - github-registry-token
    - github-oauth-client-id
    - github-oauth-client-secret
    - github-token-encryption-keys
    - github-webhook-secret
    - grafana-admin-password
    - keycloak-client-secret
---
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: arcl-cmp-frontend-secret
  namespace: arcl-cmp
spec:
  path: kvv2/arcl-cmp/frontend
  vaultRole: arcl-cmp-role
  keys:
    - nextauth-secret
  type: Opaque
---
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: cmp-route-envoy-auth-secret
  namespace: arcl-cmp
spec:
  path: kvv2/arcl-cmp/envoy-auth
  vaultRole: arcl-cmp-role
  keys:
    - client-secret
  type: Opaque
---
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: arcl-cmp-metrics
  namespace: arcl-cmp
spec:
  path: kvv2/arcl-cmp/metrics
  vaultRole: arcl-cmp-role
  keys:
    - metrics-project-key
  type: Opaque
---
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: arcl-cmp-finops-oidc
  namespace: arcl-cmp
spec:
  path: kvv2/arcl-cmp/finops-oidc
  vaultRole: arcl-cmp-role
  type: Opaque
  keys:
    - client-secret
---
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: arcl-cmp-keycloak-provisioner
  namespace: arcl-cmp
spec:
  path: kvv2/arcl-cmp/keycloak-provisioner
  vaultRole: arcl-cmp-role
  type: Opaque
  keys:
    - client-id
    - client-secret
---
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: arcl-cmp-tfstate-oidc
  namespace: arcl-cmp
spec:
  path: kvv2/arcl-cmp/tfstate-oidc
  vaultRole: arcl-cmp-role
  type: Opaque
  keys:
    - client-secret
---
# The CMP's own AI gateway client (cmp-ai): agent drafts. Written by
# terraform/ai_gateway.tf.
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: arcl-cmp-ai-gateway
  namespace: arcl-cmp
spec:
  path: kvv2/arcl-cmp/ai-gateway-client
  vaultRole: arcl-cmp-role
  type: Opaque
  keys:
    - client_secret
