# Opt-in only: include in the CMP base after every listed Vault key is ready.
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: arcl-cmp-github-oauth
  namespace: arcl-cmp
spec:
  path: kvv2/arcl-cmp/github-oauth
  vaultRole: arcl-cmp-role
  type: Opaque
  keys:
  - github-oauth-client-id
  - github-oauth-client-secret
  - github-oauth-redirect-uri
  - github-oauth-token-key
