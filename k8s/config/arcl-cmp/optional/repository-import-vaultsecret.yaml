# Opt-in only: include in the CMP base after every listed Vault key is ready.
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: arcl-cmp-repository-import
  namespace: arcl-cmp
spec:
  path: kvv2/arcl-cmp/repository-import
  vaultRole: arcl-cmp-role
  type: Opaque
  keys:
  - import-workflow-repo
  - import-workflow-ref
  - import-dispatch-workflow
  - import-chart-sha
  - import-workflow-sha
  - import-oidc-audience
  - import-user-audience
  - import-image-prefix
  - import-max-image-bytes
  - import-domain
  - import-allowed-project
  - import-callback-url
  - import-argocd-url
  - import-argocd-token
