replicaCount: 1

image:
  backend:
    repository: ghcr.io/3-istor/cmp-backend
    pullPolicy: Always
    tag: "latest"
  frontend:
    repository: ghcr.io/3-istor/cmp-frontend
    pullPolicy: Always
    tag: "latest"

frontend:
  apiUrl: "https://cmp.3istor.com/api"
  authUrl: "https://cmp.3istor.com/"

ingress:
  enabled: false

podSecurityContext:
  fsGroup: 1001

securityContext:
  runAsUser: 1001

resources:
  backend:
    limits:
      cpu: 1000m
      memory: "1Gi"
    requests:
      cpu: 50m
      memory: "1Gi"

  frontend:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 512Mi

persistence:
  enabled: true
  storageClass: "local-path"
  backend:
    size: 2Gi
    accessMode: ReadWriteOnce

env:
  backend:
    DATABASE_URL: "sqlite:////app/db/arcl.db"
    TF_BACKEND_S3_ENABLED: "true"
    KEYCLOAK_URL: "https://auth.3istor.com"
    KEYCLOAK_CLIENT_ID: "3-istor-openid"
    VAULT_URL: "http://vault.vault.svc.cluster.local:8200"
    # Import activation is a separate reviewed change after preflight.
    IMPORT_ENABLED: "false"
    # FinOps: real costs. Backfill starts at the oldest day VictoriaMetrics
    # still holds (14-day retention); days before OpenCost's install have no
    # idle cost.
    FINOPS_INGEST_ENABLED: "true"
    FINOPS_PROVIDER: "real"
    FINOPS_INGEST_SINCE: "2026-10-12"

extraEnv:
  # --- OpenStack SDK ---
  - name: OS_AUTH_URL
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: os-auth-url
  - name: OS_PROJECT_NAME
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: os-project-name
  - name: OS_USERNAME
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: os-username
  - name: OS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: os-password
  - name: OS_USER_DOMAIN_NAME
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: os-user-domain-name
  - name: OS_PROJECT_DOMAIN_NAME
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: os-project-domain-name
  - name: OS_ENDPOINT_TYPE
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: os-endpoint-type

  # --- AWS SDK & Terraform S3 Backend ---
  - name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: aws-access-key-id
  - name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: aws-secret-access-key
  - name: AWS_DEFAULT_REGION
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: aws-region
  - name: TF_BACKEND_AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: aws-access-key-id
  - name: TF_BACKEND_AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: aws-secret-access-key
  - name: TF_BACKEND_AWS_REGION
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: aws-region
  - name: TF_BACKEND_S3_BUCKET
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: aws-s3-bucket
  - name: TF_BACKEND_S3_KEY_PREFIX
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: aws-s3-key-prefix

  # --- Avatars S3 Compatible Storage ---
  - name: AVATARS_S3_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: avatars-s3-access-key-id
  - name: AVATARS_S3_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: avatars-s3-secret-access-key
  - name: AVATARS_S3_ENDPOINT
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: avatars-s3-endpoint
  - name: AVATARS_S3_BUCKET
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: avatars-s3-bucket
  - name: AVATARS_S3_REGION
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: avatars-s3-region
  - name: AVATARS_PUBLIC_URL_BASE
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: avatars-s3-public-url-base

  # --- App icons (CNP-198): private bucket on the same Garage endpoint ---
  - name: ICONS_S3_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: icons-s3-access-key-id
  - name: ICONS_S3_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: icons-s3-secret-access-key

  # --- Cloudflare API & Account ---
  - name: CLOUDFLARE_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: cloudflare-api-token
  - name: CLOUDFLARE_ZONE_ID
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: cloudflare-zone-id
  - name: CLOUDFLARE_ACCOUNT_ID
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: cloudflare-account-id

  # --- Keycloak Admin client ---
  - name: KEYCLOAK_ADMIN_USERNAME
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: keycloak-admin-username
  - name: KEYCLOAK_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: keycloak-admin-password

  # --- HashiCorp Vault Client ---
  - name: VAULT_TOKEN
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: vault-token

  # --- GitHub Integration & Registry (GHCR) ---
  - name: GITHUB_APP_ID
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: github-app-id
  - name: GITHUB_APP_PRIVATE_KEY
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: github-app-private-key
  - name: GITHUB_INSTALLATION_ID
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: github-installation-id
  - name: GITHUB_REGISTRY_USERNAME
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: github-registry-username
  - name: GITHUB_REGISTRY_TOKEN
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: github-registry-token

  # --- Direct GitHub OAuth; absent credentials keep linking disabled ---
  - name: GITHUB_OAUTH_CLIENT_ID
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-github-oauth
        key: github-oauth-client-id
        optional: true
  - name: GITHUB_OAUTH_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-github-oauth
        key: github-oauth-client-secret
        optional: true
  - name: GITHUB_OAUTH_REDIRECT_URI
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-github-oauth
        key: github-oauth-redirect-uri
        optional: true
  - name: GITHUB_OAUTH_TOKEN_KEY
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-github-oauth
        key: github-oauth-token-key
        optional: true

  # --- Repository import settings; IMPORT_ENABLED remains false above ---
  - name: IMPORT_WORKFLOW_REPO
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-repository-import
        key: import-workflow-repo
        optional: true
  - name: IMPORT_WORKFLOW_REF
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-repository-import
        key: import-workflow-ref
        optional: true
  - name: IMPORT_DISPATCH_WORKFLOW
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-repository-import
        key: import-dispatch-workflow
        optional: true
  - name: IMPORT_CHART_SHA
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-repository-import
        key: import-chart-sha
        optional: true
  - name: IMPORT_WORKFLOW_SHA
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-repository-import
        key: import-workflow-sha
        optional: true
  - name: IMPORT_OIDC_AUDIENCE
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-repository-import
        key: import-oidc-audience
        optional: true
  - name: IMPORT_USER_AUDIENCE
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-repository-import
        key: import-user-audience
        optional: true
  - name: IMPORT_IMAGE_PREFIX
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-repository-import
        key: import-image-prefix
        optional: true
  - name: IMPORT_MAX_IMAGE_BYTES
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-repository-import
        key: import-max-image-bytes
        optional: true
  - name: IMPORT_DOMAIN
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-repository-import
        key: import-domain
        optional: true
  - name: IMPORT_ALLOWED_PROJECT
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-repository-import
        key: import-allowed-project
        optional: true
  - name: IMPORT_CALLBACK_URL
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-repository-import
        key: import-callback-url
        optional: true
  - name: IMPORT_ARGOCD_URL
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-repository-import
        key: import-argocd-url
        optional: true
  - name: IMPORT_ARGOCD_TOKEN
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-repository-import
        key: import-argocd-token
        optional: true

  # --- Alerting ---
  - name: DISCORD_WEBHOOK_URL
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: discord-webhook-url
  - name: SECURITY_DISCORD_WEBHOOK_URL
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: security-discord-webhook-url
        optional: true

  - name: GRAFANA_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: grafana-admin-password

  - name: KEYCLOAK_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: keycloak-client-secret

  # --- Activity tab: Loki through its authenticating gateway ---
  - name: LOKI_URL
    value: "http://loki-gateway.observability.svc.cluster.local"
  - name: LOKI_USERNAME
    value: cmp
  - name: LOKI_PASSWORD
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-loki
        key: loki-password
  # Handed to each project's Grafana org as its Loki datasource credential.
  - name: LOKI_GRAFANA_PROJECTS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-loki
        key: grafana-projects-loki-password

  # --- Per-project metrics isolation (vmauth users derived from this key) ---
  - name: METRICS_PROJECT_KEY
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-metrics
        key: metrics-project-key

secrets:
  create: false

backend:
  serviceAccount:
    create: false
    name: "cmp-backend-sa"
