replicaCount: 1

image:
  backend:
    repository: ghcr.io/3-istor/cmp-backend
    pullPolicy: Always
    tag: "latest"
  frontend:
    repository: ghcr.io/3-istor/cmp-frontend
    pullPolicy: Always
    tag: "latest"

frontend:
  apiUrl: "https://cmp.3istor.com/api"
  authUrl: "https://cmp.3istor.com/"

ingress:
  enabled: false

podSecurityContext:
  fsGroup: 1001

securityContext:
  runAsUser: 1001

resources:
  backend:
    limits:
      cpu: 1000m
      memory: "1Gi"
    requests:
      cpu: 50m
      memory: "1Gi"

  frontend:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 512Mi

persistence:
  enabled: true
  storageClass: "local-path"
  backend:
    size: 2Gi
    accessMode: ReadWriteOnce

env:
  backend:
    DATABASE_URL: "sqlite:////app/db/arcl.db"
    TF_BACKEND_S3_ENABLED: "true"
    # State bucket through role cnp-tfstate-cmp with the Keycloak token of
    # client cnp-tfstate (Cloud repo, terraform/public/aws/cmp-iam). Also the
    # identity of the AWS provider and of the ASG/ALB health checks: the pod
    # carries no static AWS key.
    TF_BACKEND_AWS_ROLE_ARN: "arn:aws:iam::947554757826:role/cnp-tfstate-cmp"
    KEYCLOAK_URL: "https://auth.3istor.com"
    KEYCLOAK_CLIENT_ID: "3-istor-openid"
    # Clients whose access tokens the API accepts (azp). Set apart from
    # KEYCLOAK_CLIENT_ID, which is also the backend's admin client.
    KEYCLOAK_ALLOWED_CLIENTS: "3-istor-openid"
    VAULT_URL: "http://vault.vault.svc.cluster.local:8200"
    # Log in as Vault role cmp-backend with the pod's ServiceAccount (arcl-cmp)
    # instead of VAULT_TOKEN. Empty switches back to the static token.
    VAULT_AUTH: "kubernetes"
    # Destructive actions and elevated access ask for a passkey used in the
    # last 5 minutes (Keycloak LoA 2, flow v6). "false" turns the check off.
    STEP_UP_ENABLED: "true"
    # Project export dump Jobs upload to Garage through its Service, so a
    # database dump never leaves the cluster. Download links use the public
    # endpoint (the avatars one).
    EXPORT_S3_INTERNAL_ENDPOINT: "http://garage.garage-s3.svc.cluster.local:3900"
    # FinOps: real costs. Backfill starts at the oldest day VictoriaMetrics
    # still holds (14-day retention); days before OpenCost's install have no
    # idle cost.
    FINOPS_INGEST_ENABLED: "true"
    FINOPS_PROVIDER: "real"
    FINOPS_INGEST_SINCE: "2026-10-12"
    # Cloud clusters' OpenCost through the WireGuard flow 18081. Probed once
    # per pass: a stopped cloud is skipped in seconds.
    FINOPS_OPENCOST_CLUSTERS: "aws=http://aws-apps.wireguard.svc.cluster.local:18081,gcp=http://gcp-apps.wireguard.svc.cluster.local:18081"
    # Invoices, read with the Keycloak token of client cnp-finops (no cloud
    # key): Cloud repo terraform/public/{aws,gcp}/billing.
    FINOPS_AWS_ROLE_ARN: "arn:aws:iam::947554757826:role/cnp-finops-reader"
    FINOPS_AWS_EXPORT_BUCKET: "cnp-billing-exports-757826"
    FINOPS_AWS_EXPORT_PREFIX: "focus/cnp-focus"
    FINOPS_GCP_PROJECT: "project-94dabc15-3981-4317-8da"
    FINOPS_GCP_BILLING_TABLE: "project-94dabc15-3981-4317-8da.cnp_billing.gcp_billing_export_resource_v1_*"
    FINOPS_GCP_SERVICE_ACCOUNT: "cnp-finops-reader@project-94dabc15-3981-4317-8da.iam.gserviceaccount.com"
    # Output finops_wif_audience of the GCP billing root.
    FINOPS_GCP_WIF_AUDIENCE: "//iam.googleapis.com/projects/943089725730/locations/global/workloadIdentityPools/cnp-finops/providers/keycloak"

extraEnv:
  # --- FinOps: Keycloak client federated to AWS STS and GCP WIF ---
  - name: FINOPS_OIDC_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-finops-oidc
        key: client-secret
  # --- Terraform state: Keycloak client federated to AWS STS ---
  - name: TF_BACKEND_OIDC_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-tfstate-oidc
        key: client-secret
        optional: true
  # --- OpenStack SDK ---
  - name: OS_AUTH_URL
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: os-auth-url
  - name: OS_PROJECT_NAME
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: os-project-name
  - name: OS_USERNAME
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: os-username
  - name: OS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: os-password
  - name: OS_USER_DOMAIN_NAME
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: os-user-domain-name
  - name: OS_PROJECT_DOMAIN_NAME
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: os-project-domain-name
  - name: OS_ENDPOINT_TYPE
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: os-endpoint-type

  # --- AWS SDK & Terraform S3 Backend ---
  - name: AWS_DEFAULT_REGION
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: aws-region
  - name: TF_BACKEND_AWS_REGION
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: aws-region
  - name: TF_BACKEND_S3_BUCKET
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: aws-s3-bucket
  - name: TF_BACKEND_S3_KEY_PREFIX
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: aws-s3-key-prefix

  # --- Avatars S3 Compatible Storage ---
  - name: AVATARS_S3_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: avatars-s3-access-key-id
  - name: AVATARS_S3_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: avatars-s3-secret-access-key
  - name: AVATARS_S3_ENDPOINT
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: avatars-s3-endpoint
  - name: AVATARS_S3_BUCKET
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: avatars-s3-bucket
  - name: AVATARS_S3_REGION
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: avatars-s3-region
  - name: AVATARS_PUBLIC_URL_BASE
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: avatars-s3-public-url-base

  # --- App icons (CNP-198): private bucket on the same Garage endpoint ---
  - name: ICONS_S3_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: icons-s3-access-key-id
  - name: ICONS_S3_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: icons-s3-secret-access-key

  # --- Project exports (EU Data Act, B1): private bucket cnp-project-exports
  # on the same Garage endpoint, which must stay the public one: the download
  # link is presigned for that host.
  - name: EXPORT_S3_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: export-s3-access-key-id
  - name: EXPORT_S3_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: export-s3-secret-access-key

  # --- Cloudflare API & Account ---
  - name: CLOUDFLARE_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: cloudflare-api-token
  - name: CLOUDFLARE_ZONE_ID
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: cloudflare-zone-id
  - name: CLOUDFLARE_ACCOUNT_ID
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: cloudflare-account-id

  # --- Keycloak master realm: cmp-provisioner client, never the admin user ---
  - name: KEYCLOAK_PROVISIONER_CLIENT_ID
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-keycloak-provisioner
        key: client-id
  - name: KEYCLOAK_PROVISIONER_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-keycloak-provisioner
        key: client-secret

  # --- HashiCorp Vault Client ---
  - name: VAULT_TOKEN
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: vault-token

  # --- GitHub Integration & Registry (GHCR) ---
  - name: GITHUB_APP_ID
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: github-app-id
  - name: GITHUB_APP_PRIVATE_KEY
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: github-app-private-key
  - name: GITHUB_INSTALLATION_ID
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: github-installation-id
  - name: GITHUB_REGISTRY_USERNAME
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: github-registry-username
  - name: GITHUB_REGISTRY_TOKEN
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: github-registry-token

  # --- Alerting ---
  - name: DISCORD_WEBHOOK_URL
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: discord-webhook-url
  - name: SECURITY_DISCORD_WEBHOOK_URL
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: security-discord-webhook-url
        optional: true

  - name: GRAFANA_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: grafana-admin-password

  - name: KEYCLOAK_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: keycloak-client-secret

  # --- Activity tab: Loki through its authenticating gateway ---
  - name: LOKI_URL
    value: "http://loki-gateway.observability.svc.cluster.local"
  - name: LOKI_USERNAME
    value: cmp
  - name: LOKI_PASSWORD
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-loki
        key: loki-password
  # Handed to each project's Grafana org as its Loki datasource credential.
  - name: LOKI_GRAFANA_PROJECTS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-loki
        key: grafana-projects-loki-password

  # --- Per-project metrics isolation (vmauth users derived from this key) ---
  - name: METRICS_PROJECT_KEY
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-metrics
        key: metrics-project-key

secrets:
  create: false

backend:
  serviceAccount:
    create: false
    name: "cmp-backend-sa"
