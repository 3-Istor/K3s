replicaCount: 1

image:
  backend:
    repository: ghcr.io/3-istor/cmp-backend
    pullPolicy: Always
    tag: "latest"
  frontend:
    repository: ghcr.io/3-istor/cmp-frontend
    pullPolicy: Always
    tag: "latest"

frontend:
  apiUrl: "https://cmp.3istor.com/api"
  authUrl: "https://cmp.3istor.com/"

ingress:
  enabled: false

podSecurityContext:
  fsGroup: 1001

securityContext:
  runAsUser: 1001

resources:
  # The backend averages ~520m and reaches ~880m at p95 over 7 days (CNP-272).
  backend:
    limits:
      cpu: 1000m
      memory: "1Gi"
    requests:
      cpu: 500m
      memory: "1Gi"

  frontend:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 256Mi

persistence:
  enabled: true
  storageClass: "ceph-rbd"
  backend:
    size: 2Gi
    accessMode: ReadWriteOnce

env:
  backend:
    DATABASE_URL: "sqlite:////app/db/arcl.db"
    TF_BACKEND_S3_ENABLED: "true"
    # State bucket through role cnp-tfstate-cmp with the Keycloak token of
    # client cnp-tfstate (Cloud repo, terraform/public/aws/cmp-iam). Also the
    # identity of the AWS provider and of the ASG/ALB health checks: the pod
    # carries no static AWS key.
    TF_BACKEND_AWS_ROLE_ARN: "arn:aws:iam::947554757826:role/cnp-tfstate-cmp"
    # CNP-185 V4: the CMP writes the gateway's per-project trace routing.
    OBS_TRACES_ROUTING_ENABLED: "true"
    # CNP-185 V4/V5: stores the projects' vmauth and the portal read.
    OBS_VMSINGLE_URL: "http://vmsingle-cnp.observability.svc:8429"
    OBS_VLOGS_URL: "http://vlogs-cnp.observability.svc:9428"
    OBS_VTRACES_URL: "http://vtraces-cnp.observability.svc:10428"
    OBS_GRAFANA_PROVISIONING_ENABLED: "true"
    # VMAlert and VMAlertmanager of V3 are live (K3s#205, #253).
    OBS_V3_ENABLED: "true"
    # CNP-185 V2: log-derived alert metrics from the VictoriaLogs recording rules.
    LOGS_BACKEND: "vl"
    KEYCLOAK_URL: "https://auth.3istor.com"
    KEYCLOAK_CLIENT_ID: "3-istor-openid"
    # Clients whose access tokens the API accepts (azp). Set apart from
    # KEYCLOAK_CLIENT_ID, which is also the backend's admin client.
    KEYCLOAK_ALLOWED_CLIENTS: "3-istor-openid"
    VAULT_URL: "http://vault.vault.svc.cluster.local:8200"
    # Log in as Vault role cmp-backend with the pod's ServiceAccount (arcl-cmp).
    VAULT_AUTH: "kubernetes"
    # Destructive actions and elevated access ask for a passkey used in the
    # last 5 minutes (Keycloak LoA 2, flow v6). "false" turns the check off.
    # Off while the gold access token is refused after a fresh passkey (CNP-124):
    # back to "true" once the token check passes again.
    STEP_UP_ENABLED: "false"
    # CMP buckets live on the Ceph RGW (CNP-189), one ObjectBucketClaim each
    # (s3-buckets.yaml). Avatars are public through avatars-s3.3istor.com.
    AVATARS_S3_ENDPOINT: "http://192.168.1.110:7480"
    AVATARS_S3_BUCKET: "user-avatars"
    AVATARS_S3_REGION: "us-east-1"
    AVATARS_PUBLIC_URL_BASE: "https://avatars-s3.3istor.com"
    ICONS_S3_ENDPOINT: "http://192.168.1.110:7480"
    ICONS_S3_REGION: "us-east-1"
    # Download links are presigned for the public host, which only exposes
    # this bucket. Dump Jobs upload through the RGW directly, so a database
    # dump never leaves the private network.
    EXPORT_S3_ENDPOINT: "https://s3.3istor.com"
    EXPORT_S3_INTERNAL_ENDPOINT: "http://192.168.1.110:7480"
    EXPORT_S3_REGION: "us-east-1"
    # FinOps: real costs. Backfill starts at the oldest day VictoriaMetrics
    # still holds (14-day retention); days before OpenCost's install have no
    # idle cost.
    FINOPS_INGEST_ENABLED: "true"
    FINOPS_PROVIDER: "real"
    FINOPS_INGEST_SINCE: "2026-10-12"
    # Cloud clusters' OpenCost through the WireGuard flow 18081. Probed once
    # per pass: a stopped cloud is skipped in seconds.
    FINOPS_OPENCOST_CLUSTERS: "aws=http://aws-apps.wireguard.svc.cluster.local:18081,gcp=http://gcp-apps.wireguard.svc.cluster.local:18081"
    # Invoices, read with the Keycloak token of client cnp-finops (no cloud
    # key): Cloud repo terraform/public/{aws,gcp}/billing.
    FINOPS_AWS_ROLE_ARN: "arn:aws:iam::947554757826:role/cnp-finops-reader"
    FINOPS_AWS_EXPORT_BUCKET: "cnp-billing-exports-757826"
    FINOPS_AWS_EXPORT_PREFIX: "focus/cnp-focus"
    FINOPS_GCP_PROJECT: "project-94dabc15-3981-4317-8da"
    FINOPS_GCP_BILLING_TABLE: "project-94dabc15-3981-4317-8da.cnp_billing.gcp_billing_export_resource_v1_*"
    FINOPS_GCP_SERVICE_ACCOUNT: "cnp-finops-reader@project-94dabc15-3981-4317-8da.iam.gserviceaccount.com"
    # Output finops_wif_audience of the GCP billing root.
    FINOPS_GCP_WIF_AUDIENCE: "//iam.googleapis.com/projects/943089725730/locations/global/workloadIdentityPools/cnp-finops/providers/keycloak"
    # Repository import.
    IMPORT_ENABLED: "true"
    # CNP-303: open a PR that makes an imported repo template-conformant.
    IMPORT_STANDARD_PR_ENABLED: "true"
    # Numeric ids of 3-Istor/extern-project-analyzer and of the 3-Istor org,
    # pinned in the workflow's OIDC token: a recreated repository gets new ids.
    IMPORT_WORKFLOW_REPO_ID: "1267361656"
    IMPORT_WORKFLOW_OWNER_ID: "271529816"
    # Commits of .github/workflows/import.yml allowed to call the worker API,
    # comma separated. A workflow change is live only once its commit is here.
    IMPORT_WORKFLOW_SHAS: "710937a68f0e2333a0e7c39c24947d0e71e3469a,fe348b4edd2ef9f57d6111fe24cd392013e0d4fc,fae32ad782d2571ae57e9760cf06e19e22e0099c,5e801a917713c2c4ed4993c69207af07d4d8366a,872c1407e1287ed8326d8645764a892b1a882977,37746aa61fa8334dcf0845848c3034fb6394f758,103a00f3cfa14e8150268472d412a662520ed5c7,f2f98b80d55cf8370ac9ba2f598899853ef571d6,4e7f9617832adfdffccbf36abc0e7a8b9c5e7544"
    IMPORT_OIDC_AUDIENCE: "cmp-import"
    # "self-hosted" only for a runner group of ephemeral, one-job runners: a
    # persistent runner lets one import read the next one's source and tokens.
    # Runner group cnp-import-ephemeral, fed by 3-Istor/Cloud cnp-import-runner.
    IMPORT_ALLOWED_RUNNER_ENVIRONMENTS: '["self-hosted"]'

extraEnv:
  # --- FinOps: Keycloak client federated to AWS STS and GCP WIF ---
  - name: FINOPS_OIDC_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-finops-oidc
        key: client-secret
  # --- AI gateway: the CMP's own client (cmp-ai) ---
  - name: AI_CMP_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-ai-gateway
        key: client_secret
        optional: true
  # --- Terraform state: Keycloak client federated to AWS STS ---
  - name: TF_BACKEND_OIDC_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-tfstate-oidc
        key: client-secret
        optional: true
  # --- OpenStack SDK ---
  - name: OS_AUTH_URL
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: os-auth-url
  - name: OS_PROJECT_NAME
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: os-project-name
  - name: OS_USERNAME
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: os-username
  - name: OS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: os-password
  - name: OS_USER_DOMAIN_NAME
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: os-user-domain-name
  - name: OS_PROJECT_DOMAIN_NAME
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: os-project-domain-name
  - name: OS_ENDPOINT_TYPE
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: os-endpoint-type

  # --- AWS SDK & Terraform S3 Backend ---
  - name: AWS_DEFAULT_REGION
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: aws-region
  - name: TF_BACKEND_AWS_REGION
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: aws-region
  - name: TF_BACKEND_S3_BUCKET
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: aws-s3-bucket
  - name: TF_BACKEND_S3_KEY_PREFIX
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: aws-s3-key-prefix

  # --- CMP buckets on the RGW: keys from each ObjectBucketClaim's Secret ---
  - name: AVATARS_S3_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: user-avatars
        key: AWS_ACCESS_KEY_ID
  - name: AVATARS_S3_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: user-avatars
        key: AWS_SECRET_ACCESS_KEY
  - name: ICONS_S3_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: cnp-app-icons
        key: AWS_ACCESS_KEY_ID
  - name: ICONS_S3_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: cnp-app-icons
        key: AWS_SECRET_ACCESS_KEY
  - name: EXPORT_S3_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: cnp-project-exports
        key: AWS_ACCESS_KEY_ID
  - name: EXPORT_S3_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: cnp-project-exports
        key: AWS_SECRET_ACCESS_KEY

  # --- Cloudflare API & Account ---
  - name: CLOUDFLARE_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: cloudflare-api-token
  - name: CLOUDFLARE_ZONE_ID
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: cloudflare-zone-id
  - name: CLOUDFLARE_ACCOUNT_ID
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: cloudflare-account-id

  # --- Keycloak master realm: cmp-provisioner client, never the admin user ---
  - name: KEYCLOAK_PROVISIONER_CLIENT_ID
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-keycloak-provisioner
        key: client-id
  - name: KEYCLOAK_PROVISIONER_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-keycloak-provisioner
        key: client-secret

  # --- GitHub Integration & Registry (GHCR) ---
  - name: GITHUB_APP_ID
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: github-app-id
  - name: GITHUB_APP_PRIVATE_KEY
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: github-app-private-key
  - name: GITHUB_INSTALLATION_ID
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: github-installation-id
  - name: GITHUB_REGISTRY_USERNAME
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: github-registry-username
  - name: GITHUB_REGISTRY_TOKEN
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: github-registry-token
  # GitHub account linking for repository import. Optional: the CMP keeps
  # linking off while one is missing, and the keys only exist in Vault once
  # terraform/secret_templates.tf is applied.
  - name: GITHUB_OAUTH_CLIENT_ID
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: github-oauth-client-id
        optional: true
  - name: GITHUB_OAUTH_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: github-oauth-client-secret
        optional: true
  - name: GITHUB_TOKEN_ENCRYPTION_KEYS
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: github-token-encryption-keys
        optional: true
  # Push webhook of the CNP-Portal app. Optional: without it the CMP refuses
  # every delivery and imported apps rebuild only through the reconciler.
  - name: GITHUB_WEBHOOK_SECRET
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: github-webhook-secret
        optional: true

  # --- Alerting ---
  - name: DISCORD_WEBHOOK_URL
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: discord-webhook-url
  - name: SECURITY_DISCORD_WEBHOOK_URL
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: security-discord-webhook-url
        optional: true

  - name: GRAFANA_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: grafana-admin-password

  - name: KEYCLOAK_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-secret
        key: keycloak-client-secret

  # --- Per-project metrics isolation (vmauth users derived from this key) ---
  - name: METRICS_PROJECT_KEY
    valueFrom:
      secretKeyRef:
        name: arcl-cmp-metrics
        key: metrics-project-key

secrets:
  create: false

backend:
  serviceAccount:
    create: false
    name: "cmp-backend-sa"
