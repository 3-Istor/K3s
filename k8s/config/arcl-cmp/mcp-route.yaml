# AI assistants reach the CMP's MCP server and the OAuth server that issues
# their tokens. The tokens are the CMP's own, not Keycloak JWTs: this route
# carries no SecurityPolicy, the backend verifies every token itself.
# Exact and longer prefix matches win over cmp-route-route's "/" and "/api".
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cmp-mcp
  namespace: arcl-cmp
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared-gateway
      namespace: gateway-infra
  hostnames:
    - cmp.3istor.com
  rules:
    # Streamable HTTP: a tool call can wait up to a minute (wait_for_app).
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      timeouts:
        request: 5m
      backendRefs:
        - name: arcl-cmp-backend
          port: 8000
    - matches:
        - path:
            type: Exact
            value: /authorize
        - path:
            type: Exact
            value: /token
        - path:
            type: Exact
            value: /register
        - path:
            type: Exact
            value: /revoke
        - path:
            type: PathPrefix
            value: /.well-known/oauth-authorization-server
        - path:
            type: PathPrefix
            value: /.well-known/oauth-protected-resource
      backendRefs:
        - name: arcl-cmp-backend
          port: 8000
