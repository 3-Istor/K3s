apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cmp-terraform-runner-role
rules:
  - apiGroups: [""]
    resources: ["namespaces", "secrets"]
    verbs: ["*"]

  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["argoproj.io"]
    resources: ["applications", "appprojects"]
    verbs: ["*"]

  - apiGroups: ["argocd-image-updater.argoproj.io"]
    resources: ["imageupdaters"]
    verbs: ["*"]

  - apiGroups: ["ricoberger.de"]
    resources: ["vaultsecrets"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cmp-terraform-runner-binding
subjects:
  - kind: ServiceAccount
    name: arcl-cmp
    namespace: arcl-cmp
roleRef:
  kind: ClusterRole
  name: cmp-terraform-runner-role
  apiGroup: rbac.authorization.k8s.io
---
# What the CMP's security dashboard reads, plus the two actions it offers.
# Kept apart from cmp-terraform-runner-role so it can be reviewed on its own.
# Deleting a Trivy report is how a rescan is requested: the operator
# recreates it. Creating a CNPG Backup is the manual backup button.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cmp-security-reader
rules:
  - apiGroups: ["wgpolicyk8s.io"]
    resources: ["policyreports"]
    verbs: ["get", "list"]
  - apiGroups: ["cilium.io"]
    resources: ["ciliumclusterwidenetworkpolicies"]
    verbs: ["get", "list"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "backups", "scheduledbackups"]
    verbs: ["get", "list"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["backups"]
    verbs: ["create"]
  - apiGroups: ["aquasecurity.github.io"]
    resources:
      ["vulnerabilityreports", "exposedsecretreports", "configauditreports"]
    verbs: ["get", "list"]
  - apiGroups: ["aquasecurity.github.io"]
    resources: ["vulnerabilityreports", "exposedsecretreports"]
    verbs: ["delete", "deletecollection"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cmp-security-reader
subjects:
  - kind: ServiceAccount
    name: arcl-cmp
    namespace: arcl-cmp
roleRef:
  kind: ClusterRole
  name: cmp-security-reader
  apiGroup: rbac.authorization.k8s.io
