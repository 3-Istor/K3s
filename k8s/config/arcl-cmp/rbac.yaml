apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cmp-terraform-runner-role
rules:
  - apiGroups: [""]
    resources: ["namespaces", "secrets"]
    verbs: ["*"]

  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["argoproj.io"]
    resources: ["applications", "appprojects"]
    verbs: ["*"]

  - apiGroups: ["argocd-image-updater.argoproj.io"]
    resources: ["imageupdaters"]
    verbs: ["*"]

  - apiGroups: ["ricoberger.de"]
    resources: ["vaultsecrets"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cmp-terraform-runner-binding
subjects:
  - kind: ServiceAccount
    name: arcl-cmp
    namespace: arcl-cmp
roleRef:
  kind: ClusterRole
  name: cmp-terraform-runner-role
  apiGroup: rbac.authorization.k8s.io
---
# What the CMP's security dashboard reads, plus the two actions it offers.
# Kept apart from cmp-terraform-runner-role so it can be reviewed on its own.
# Deleting a Trivy report is how a rescan is requested: the operator
# recreates it. Creating a CNPG Backup is the manual backup button.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cmp-security-reader
rules:
  - apiGroups: ["wgpolicyk8s.io"]
    resources: ["policyreports"]
    verbs: ["get", "list"]
  - apiGroups: ["cilium.io"]
    resources: ["ciliumclusterwidenetworkpolicies"]
    verbs: ["get", "list"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "backups", "scheduledbackups"]
    verbs: ["get", "list"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["backups"]
    verbs: ["create"]
  - apiGroups: ["aquasecurity.github.io"]
    resources:
      ["vulnerabilityreports", "exposedsecretreports", "configauditreports"]
    verbs: ["get", "list"]
  - apiGroups: ["aquasecurity.github.io"]
    resources: ["vulnerabilityreports", "exposedsecretreports"]
    verbs: ["delete", "deletecollection"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cmp-security-reader
subjects:
  - kind: ServiceAccount
    name: arcl-cmp
    namespace: arcl-cmp
roleRef:
  kind: ClusterRole
  name: cmp-security-reader
  apiGroup: rbac.authorization.k8s.io
---
# Release tab: reads Rollout progress and drives promote/skip/abort/retry,
# which are all patches on the status subresource, never on the spec.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cmp-release-operator
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts", "analysisruns"]
    verbs: ["get", "list"]
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts/status"]
    verbs: ["patch"]
  - apiGroups: ["argoproj.io"]
    resources: ["analysistemplates", "clusteranalysistemplates"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["list"]
  # The deployment history reads each Deployment's rollout condition.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
  # The route reconciler checks that a canary app's route has its canary
  # backend: one left in its rolling shape blocks the Rollout at step 0.
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cmp-release-operator
subjects:
  - kind: ServiceAccount
    name: arcl-cmp
    namespace: arcl-cmp
roleRef:
  kind: ClusterRole
  name: cmp-release-operator
  apiGroup: rbac.authorization.k8s.io
---
# Environments tab: reads which image each environment's pods really run (the
# digest a promotion copies to prod) and wakes a staging environment that
# offhours-guard put to sleep before running a verification on it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cmp-environment-operator
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list"]
  # Events card of the app page (CNP-196), read only.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
  - apiGroups: ["guard.3istor.com"]
    resources: ["offhoursschedules"]
    verbs: ["get", "list"]
  - apiGroups: ["guard.3istor.com"]
    resources: ["offhoursschedules/status"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cmp-environment-operator
subjects:
  - kind: ServiceAccount
    name: arcl-cmp
    namespace: arcl-cmp
roleRef:
  kind: ClusterRole
  name: cmp-environment-operator
  apiGroup: rbac.authorization.k8s.io
---
# Restart button of an app (CNP-197): patch the restart marker of its Deployment
# or Argo Rollout. Scoped by the admission policy below, not by this role.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cmp-app-restarter
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["patch"]
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cmp-app-restarter
subjects:
  - kind: ServiceAccount
    name: arcl-cmp
    namespace: arcl-cmp
roleRef:
  kind: ClusterRole
  name: cmp-app-restarter
  apiGroup: rbac.authorization.k8s.io
---
# The CMP may only restart project workloads: project namespaces only, and the
# workload spec must stay the same apart from the restart marker.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cmp-app-restart-only
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["*"]
        resources: ["deployments"]
        operations: ["UPDATE"]
      - apiGroups: ["argoproj.io"]
        apiVersions: ["*"]
        resources: ["rollouts"]
        operations: ["UPDATE"]
  matchConditions:
    - name: cmp-service-account
      expression: request.userInfo.username == "system:serviceaccount:arcl-cmp:arcl-cmp"
  validations:
    # The one platform exception is the trace gateway: the CMP rolls it after
    # writing the per-project routing table (CNP-185 V4).
    - expression: >-
        (has(namespaceObject.metadata.labels) &&
        "cnp.3istor.com/project" in namespaceObject.metadata.labels) ||
        (request.resource.resource == "deployments" &&
        request.namespace == "observability" &&
        request.name == "otelcol-gateway")
      message: The CMP only changes workloads in project namespaces.
    # Scaling to 0 is the only other change: a move stops the source apps.
    - expression: >-
        object.spec.template.spec == oldObject.spec.template.spec &&
        ((has(object.spec.replicas) ? object.spec.replicas : 1) ==
        (has(oldObject.spec.replicas) ? oldObject.spec.replicas : 1) ||
        (has(object.spec.replicas) && object.spec.replicas == 0))
      message: The CMP may only restart a workload or scale it to 0, not change it.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: cmp-app-restart-only
spec:
  policyName: cmp-app-restart-only
  validationActions: ["Deny"]
---
# Placement view (platform admins): which node each pod runs on, and the
# backup claims of every project. Read-only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cmp-placement-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["objectbucket.io"]
    resources: ["objectbucketclaims"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cmp-placement-reader
subjects:
  - kind: ServiceAccount
    name: arcl-cmp
    namespace: arcl-cmp
roleRef:
  kind: ClusterRole
  name: cmp-placement-reader
  apiGroup: rbac.authorization.k8s.io
---
# Project moves: the CMP refreshes the registry ApplicationSets after each
# registry commit, and pre-pulls images on the target nodes with short-lived
# Pods. Pod creation is bounded by the admission policy below.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cmp-appset-refresh
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applicationsets"]
    resourceNames: ["cnp-project-appprojects", "cnp-project-systems", "cnp-apps"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cmp-appset-refresh
  namespace: argocd
subjects:
  - kind: ServiceAccount
    name: arcl-cmp
    namespace: arcl-cmp
roleRef:
  kind: Role
  name: cmp-appset-refresh
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cmp-prepuller
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cmp-prepuller
subjects:
  - kind: ServiceAccount
    name: arcl-cmp
    namespace: arcl-cmp
roleRef:
  kind: ClusterRole
  name: cmp-prepuller
  apiGroup: rbac.authorization.k8s.io
---
# The CMP may only create and delete image pre-pull Pods: project namespaces,
# no volumes, no service account token, no host namespaces, a fixed no-op command.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cmp-prepull-only
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        operations: ["CREATE", "DELETE"]
  matchConditions:
    - name: cmp-service-account
      expression: request.userInfo.username == "system:serviceaccount:arcl-cmp:arcl-cmp"
  validations:
    - expression: >-
        request.operation != "DELETE" ||
        (has(oldObject.metadata.labels) &&
        "cnp.3istor.com/prepull" in oldObject.metadata.labels)
      message: The CMP only deletes its pre-pull Pods.
    - expression: >-
        request.operation == "DELETE" || (
        has(namespaceObject.metadata.labels) &&
        "cnp.3istor.com/project" in namespaceObject.metadata.labels &&
        has(object.metadata.labels) &&
        "cnp.3istor.com/prepull" in object.metadata.labels)
      message: The CMP only creates pre-pull Pods, in project namespaces.
    - expression: >-
        request.operation == "DELETE" || (
        has(object.spec.nodeName) && object.spec.nodeName != "" &&
        has(object.spec.automountServiceAccountToken) &&
        object.spec.automountServiceAccountToken == false &&
        !has(object.spec.volumes) &&
        !has(object.spec.initContainers) &&
        !has(object.spec.ephemeralContainers) &&
        !(has(object.spec.hostNetwork) && object.spec.hostNetwork) &&
        !(has(object.spec.hostPID) && object.spec.hostPID) &&
        !(has(object.spec.hostIPC) && object.spec.hostIPC) &&
        object.spec.containers.size() == 1)
      message: A pre-pull Pod is pinned to a node and has no volumes, token or host namespaces.
    - expression: >-
        request.operation == "DELETE" || (
        object.spec.containers[0].command == ["sh", "-c", "true"] &&
        !has(object.spec.containers[0].args) &&
        !has(object.spec.containers[0].env) &&
        !has(object.spec.containers[0].envFrom) &&
        !has(object.spec.containers[0].volumeMounts) &&
        !has(object.spec.containers[0].ports) &&
        (!has(object.spec.containers[0].securityContext) ||
        !has(object.spec.containers[0].securityContext.privileged) ||
        object.spec.containers[0].securityContext.privileged == false))
      message: A pre-pull Pod only runs a no-op command.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: cmp-prepull-only
spec:
  policyName: cmp-prepull-only
  validationActions: ["Deny"]
