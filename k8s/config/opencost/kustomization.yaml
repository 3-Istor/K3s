apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: opencost

resources:
  - namespace.yaml
  - networkpolicy.yaml

helmCharts:
  - name: opencost
    repo: https://opencost.github.io/opencost-helm-chart
    version: 2.5.33
    releaseName: opencost
    namespace: opencost
    valuesFile: values.yaml
    # Generated from finops/onprem-tco.yaml: `go -C finops run ./tco`.
    additionalValuesFiles:
      - values-pricing.yaml
