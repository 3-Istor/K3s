# OpenCost is the allocation engine only (plan FinOps D-F1): the CMP pulls its
# allocations every day and is the product. No UI, no ingress.
clusterName: onprem

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9003"
  prometheus.io/path: /metrics

extraVolumes:
  - name: tmp
    emptyDir: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

opencost:
  exporter:
    defaultClusterId: onprem
    # The clouds write to the same VictoriaMetrics (CNP-110): without this
    # filter their pods would be priced at the on-prem TCO. Series from before
    # 2026-10-27 have no cluster label and drop out of replays, which keeps
    # the lines already ingested for those days.
    extraEnv:
      PROM_CLUSTER_ID_LABEL: cluster
      CURRENT_CLUSTER_ID_FILTER_ENABLED: "true"
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 512Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
    # Custom pricing is read from /tmp/custom-config, and the cost model writes
    # its caches under /tmp.
    extraVolumeMounts:
      - name: tmp
        mountPath: /tmp

  # VictoriaMetrics answers the Prometheus API. The platform reads vmselect
  # directly like Grafana's platform org; vm-networkpolicies lets this
  # namespace in.
  prometheus:
    internal:
      enabled: false
    external:
      enabled: true
      url: http://vm-victoria-metrics-cluster-vmselect.observability.svc.cluster.local:8481/select/0/prometheus

  mcp:
    enabled: true

  carbonCost:
    enabled: true

  # kube-state-metrics already runs in observability. OpenCost's copies of its
  # series doubled every cluster-wide sum, and emitKsmV1MetricsOnly alone does
  # not stop them in 1.121. The label series stay: KSM does not emit those.
  metrics:
    kubeStateMetrics:
      emitKsmV1MetricsOnly: true
    config:
      enabled: true
      disabledMetrics:
        - kube_job_status_failed
        - kube_node_status_allocatable
        - kube_node_status_capacity
        - kube_persistentvolume_capacity_bytes
        - kube_persistentvolumeclaim_info
        - kube_persistentvolumeclaim_resource_requests_storage_bytes
        - kube_pod_container_resource_requests
        - kube_pod_container_status_running
        - kube_pod_container_status_terminated_reason
        - kube_pod_owner

  ui:
    enabled: false
