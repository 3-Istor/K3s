# The GHCR read token for the sync extension, keyed by registry host as Zot's
# credentialsFile expects. It exists only here once tenants lose app-registry.
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: zot-sync-credentials
spec:
  path: kvv2/zot/ghcr
  vaultRole: zot-role
  type: Opaque
  keys:
    - username
    - token
  templates:
    credentials.json: '{"ghcr.io":{"username":"{% .Secrets.username %}","password":"{% .Secrets.token %}"}}'
