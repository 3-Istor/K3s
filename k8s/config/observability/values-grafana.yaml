replicas: 1

# kustomize renders Helm test hooks as plain Pods, so ArgoCD would deploy the
# test pod as a permanent workload.
testFramework:
  enabled: false

deploymentStrategy:
  type: Recreate

envFromSecret: observability-secrets

# kustomize renders the chart with `helm template`, so a chart-generated admin
# secret would be re-randomised on every sync and shadow Vault through
# GF_SECURITY_ADMIN_PASSWORD. Vault is the only source.
admin:
  existingSecret: observability-secrets
  passwordKey: GRAFANA_ADMIN_PASSWORD

env:
  GF_SECURITY_ADMIN_USER: admin

envValueFrom:
  GRAFANA_LOKI_PASSWORD:
    secretKeyRef:
      name: loki-clients
      key: GRAFANA_LOKI_PASSWORD

# Grafana only reads the admin password when it creates its database, so a
# rotation in Vault never reaches the existing one without this.
extraInitContainers:
  - name: sync-admin-password
    image: docker.io/grafana/grafana:12.3.1
    command:
      - sh
      - -c
      - printf '%s' "$GRAFANA_ADMIN_PASSWORD" | grafana cli --homepath /usr/share/grafana admin reset-admin-password --password-from-stdin
    envFrom:
      - secretRef:
          name: observability-secrets
    env:
      - name: GF_PATHS_DATA
        value: /var/lib/grafana
    volumeMounts:
      - name: storage
        mountPath: /var/lib/grafana

grafana.ini:
  server:
    root_url: "https://grafana.3istor.com"
  auth.generic_oauth:
    enabled: true
    name: "3Istor ID"
    allow_sign_up: true
    client_id: "3-istor-openid"
    client_secret: $__env{OIDC_CLIENT_SECRET}
    scopes: "openid profile email roles groups"
    auth_url: "https://auth.3istor.com/realms/3istor/protocol/openid-connect/auth"
    token_url: "https://auth.3istor.com/realms/3istor/protocol/openid-connect/token"
    api_url: "https://auth.3istor.com/realms/3istor/protocol/openid-connect/userinfo"
    role_attribute_path: "contains(groups[*], 'infra') && 'Admin' || contains(groups[*], 'member') && 'Viewer'"

persistence:
  enabled: true
  storageClassName: "ceph-block"
  size: 2Gi

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: 200m
    memory: 256Mi

# We don't provision datasources automatically because you will create them per Grafana Organization (Client A, Client B) manually to enforce multi-tenancy.
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: "http://vm-victoria-metrics-cluster-vmselect.observability.svc.cluster.local:8481/select/0/prometheus"
        access: proxy
        isDefault: true
        jsonData:
          prometheusType: "Prometheus"
          manageAlerts: false

      - name: Alertmanager
        type: alertmanager
        uid: alertmanager
        url: "http://alertmanager.observability.svc.cluster.local:9093"
        access: proxy
        jsonData:
          implementation: prometheus

      # Loki runs with auth_enabled, so every query needs an explicit tenant.
      - name: Loki
        type: loki
        uid: loki
        url: "http://loki-gateway.observability.svc.cluster.local"
        access: proxy
        basicAuth: true
        basicAuthUser: grafana
        jsonData:
          httpHeaderName1: "X-Scope-OrgID"
        secureJsonData:
          httpHeaderValue1: "default"
          basicAuthPassword: "$GRAFANA_LOKI_PASSWORD"

# Configure dashboard providers.
# ref: http://docs.grafana.org/administration/provisioning/#dashboards
# `path` must be /var/lib/grafana/dashboards/<provider_name>
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/default

      - name: "kubernetes"
        orgId: 1
        folder: "Kubernetes"
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/kubernetes

      - name: "infrastructure"
        orgId: 1
        folder: "Infrastructure"
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/infrastructure

      - name: "gateway"
        orgId: 1
        folder: "Gateway API"
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/gateway

      - name: "platform"
        orgId: 1
        folder: "Platform Services"
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/platform

      - name: "observability"
        orgId: 1
        folder: "Observability"
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/observability

      - name: "logs"
        orgId: 1
        folder: "Logs"
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/logs

      - name: "finops"
        orgId: 1
        folder: "FinOps"
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/finops

# Grafana Links: https://grafana.com/grafana/dashboards/<gnetId>
dashboards:
  # Cluster-wide views built on kube-state-metrics + cAdvisor + node-exporter.
  kubernetes:
    k8s-global:
      gnetId: 15757
      revision: 43
      datasource: Prometheus
    k8s-namespaces:
      gnetId: 15758
      revision: 46
      datasource: Prometheus
    k8s-nodes:
      gnetId: 15759
      revision: 40
      datasource: Prometheus
    k8s-pods:
      gnetId: 15760
      revision: 39
      datasource: Prometheus
    k8s-apiserver:
      gnetId: 15761
      revision: 21
      datasource: Prometheus

  # Bare-metal / OS level, from node-exporter.
  infrastructure:
    node-exporter-full:
      gnetId: 1860
      revision: 45
      datasource: Prometheus

  # Doc: https://gateway.envoyproxy.io/docs/tasks/observability/gateway-api-metrics/#dashboards
  gateway:
    gateway-api-gateways:
      gnetId: 19433
      revision: 2
      datasource: Prometheus
    gateway-api-gatewayclasses:
      gnetId: 19432
      revision: 2
      datasource: Prometheus
    gateway-api-httproutes:
      gnetId: 19434
      revision: 2
      datasource: Prometheus

  # Platform components. Each one needs its ServiceMonitor/PodMonitor enabled
  # in the matching k8s/config/<component>/values.yaml.
  platform:
    argocd:
      gnetId: 14584
      revision: 1
      datasource: Prometheus
    cert-manager:
      gnetId: 20842
      revision: 3
      datasource: Prometheus
    cloudnative-pg:
      gnetId: 20417
      revision: 4
      datasource: Prometheus

  # The monitoring stack watching itself.
  observability:
    victoriametrics-cluster:
      gnetId: 11176
      revision: 60
      datasource: Prometheus
    alertmanager:
      gnetId: 9578
      revision: 4
      datasource: Prometheus
    loki-global:
      gnetId: 13407
      revision: 1
      datasource: Prometheus

  # Log exploration, backed by the Loki datasource.
  logs:
    loki-kubernetes-logs:
      gnetId: 15141
      revision: 1
      datasource: Loki

  # Cost from OpenCost (EUR per hour, custom on-prem pricing) and off-hours sleep state from offhours-guard.
  finops:
    finops-cost:
      json: |
        {
          "uid": "finops-cost",
          "title": "FinOps · coût et énergie",
          "tags": ["finops", "opencost", "offhours"],
          "timezone": "browser",
          "schemaVersion": 39,
          "version": 1,
          "editable": true,
          "refresh": "1m",
          "time": { "from": "now-24h", "to": "now" },
          "panels": [
            {
              "id": 1, "type": "row", "title": "Coût du cluster", "collapsed": false,
              "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }, "panels": []
            },
            {
              "id": 2, "type": "stat", "title": "Burn rate (€/h)",
              "gridPos": { "h": 6, "w": 6, "x": 0, "y": 1 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": { "defaults": { "unit": "currencyEUR", "decimals": 3 }, "overrides": [] },
              "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "value", "graphMode": "area", "textMode": "auto" },
              "targets": [
                { "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "sum(node_total_hourly_cost)" }
              ]
            },
            {
              "id": 3, "type": "timeseries", "title": "Burn rate dans le temps (€/h)",
              "gridPos": { "h": 6, "w": 12, "x": 6, "y": 1 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": { "defaults": { "unit": "currencyEUR", "decimals": 3 }, "overrides": [] },
              "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": false }, "tooltip": { "mode": "single", "sort": "none" } },
              "targets": [
                { "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "sum(node_total_hourly_cost)", "legendFormat": "cluster" }
              ]
            },
            {
              "id": 4, "type": "stat", "title": "Projection mensuelle (730 h)",
              "gridPos": { "h": 6, "w": 6, "x": 18, "y": 1 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": {
                  "unit": "currencyEUR", "decimals": 0,
                  "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "orange", "value": 60 } ] }
                },
                "overrides": []
              },
              "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "value", "graphMode": "none", "textMode": "auto" },
              "targets": [
                { "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "sum(node_total_hourly_cost) * 730" }
              ]
            },
            {
              "id": 5, "type": "row", "title": "Allocation par namespace", "collapsed": false,
              "gridPos": { "h": 1, "w": 24, "x": 0, "y": 7 }, "panels": []
            },
            {
              "id": 6, "type": "timeseries", "title": "Coût par namespace, top 10 (€/h)",
              "gridPos": { "h": 8, "w": 16, "x": 0, "y": 8 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": { "defaults": { "unit": "currencyEUR", "decimals": 4, "custom": { "stacking": { "mode": "normal", "group": "A" } } }, "overrides": [] },
              "options": { "legend": { "displayMode": "table", "placement": "right", "calcs": ["lastNotNull"] }, "tooltip": { "mode": "multi", "sort": "desc" } },
              "targets": [
                {
                  "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" },
                  "expr": "topk(10, sum by (exported_namespace) (container_cpu_allocation * on(node) group_left node_cpu_hourly_cost) + sum by (exported_namespace) (container_memory_allocation_bytes / 2^30 * on(node) group_left node_ram_hourly_cost))",
                  "legendFormat": "{{exported_namespace}}"
                }
              ]
            },
            {
              "id": 7, "type": "stat", "title": "Coût inactif (€/h)",
              "description": "Cluster burn rate minus cost allocated to containers.",
              "gridPos": { "h": 8, "w": 8, "x": 16, "y": 8 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": { "defaults": { "unit": "currencyEUR", "decimals": 4 }, "overrides": [] },
              "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "value", "graphMode": "area", "textMode": "auto" },
              "targets": [
                {
                  "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" },
                  "expr": "sum(node_total_hourly_cost) - (sum(container_cpu_allocation * on(node) group_left node_cpu_hourly_cost) + sum(container_memory_allocation_bytes / 2^30 * on(node) group_left node_ram_hourly_cost))"
                }
              ]
            },
            {
              "id": 8, "type": "row", "title": "Efficacité CPU", "collapsed": false,
              "gridPos": { "h": 1, "w": 24, "x": 0, "y": 16 }, "panels": []
            },
            {
              "id": 9, "type": "timeseries", "title": "Efficacité CPU par namespace (usage / requests)",
              "description": "Above 100% means the namespace uses more CPU than it requests.",
              "gridPos": { "h": 8, "w": 24, "x": 0, "y": 17 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": { "defaults": { "unit": "percentunit", "decimals": 0 }, "overrides": [] },
              "options": { "legend": { "displayMode": "table", "placement": "right", "calcs": ["lastNotNull"] }, "tooltip": { "mode": "multi", "sort": "desc" } },
              "targets": [
                {
                  "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" },
                  "expr": "sum by (namespace) (rate(container_cpu_usage_seconds_total{container!=\"\", namespace!=\"\"}[5m])) / sum by (namespace) (kube_pod_container_resource_requests{resource=\"cpu\", container!=\"\"})",
                  "legendFormat": "{{namespace}}"
                }
              ]
            },
            {
              "id": 10, "type": "row", "title": "Mise en veille (offhours-guard)", "collapsed": false,
              "gridPos": { "h": 1, "w": 24, "x": 0, "y": 25 }, "panels": []
            },
            {
              "id": 11, "type": "stat", "title": "Workloads en veille",
              "gridPos": { "h": 6, "w": 8, "x": 0, "y": 26 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": { "defaults": { "unit": "short", "decimals": 0 }, "overrides": [] },
              "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "value", "graphMode": "none", "textMode": "auto" },
              "targets": [
                { "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" }, "expr": "sum(offhours_target_asleep)" }
              ]
            },
            {
              "id": 12, "type": "stat", "title": "Replicas en veille",
              "description": "Replicas that are scaled to zero, counted from the replicas recorded before sleep.",
              "gridPos": { "h": 6, "w": 8, "x": 8, "y": 26 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": { "defaults": { "unit": "short", "decimals": 0 }, "overrides": [] },
              "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "colorMode": "value", "graphMode": "none", "textMode": "auto" },
              "targets": [
                {
                  "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" },
                  "expr": "sum(offhours_target_original_replicas and on(namespace, schedule, target) (offhours_target_asleep == 1))"
                }
              ]
            },
            {
              "id": 13, "type": "timeseries", "title": "Erreurs de transition sur 24 h",
              "gridPos": { "h": 6, "w": 8, "x": 16, "y": 26 },
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": { "defaults": { "unit": "short", "decimals": 0 }, "overrides": [] },
              "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi", "sort": "desc" } },
              "targets": [
                {
                  "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" },
                  "expr": "sum by (namespace) (increase(offhours_transitions_total{result=\"error\"}[24h]))",
                  "legendFormat": "{{namespace}}"
                }
              ]
            }
          ]
        }

# The Kyverno require-resources-and-memory-limits policy needs every container,
# including init containers, to declare requests with memory limit == request.
initChownData:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 64Mi

downloadDashboards:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 64Mi
