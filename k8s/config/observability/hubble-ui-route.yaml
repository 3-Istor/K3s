# Hubble UI (CNP-185 D13, Q8) shows every flow of every project: infra and
# security-auditor only. The route lives here rather than in kube-system,
# which the shared gateway does not admit, and reuses this namespace's
# Keycloak client secret.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui-route
spec:
  parentRefs:
    - name: shared-gateway
      namespace: gateway-infra
  hostnames:
    - hubble.3istor.com
  rules:
    - backendRefs:
        - name: hubble-ui
          namespace: kube-system
          port: 80
---
# The OIDC filter forwards the access token, and the JWT filter that runs
# after it reads the groups claim from it: the cookies themselves are
# encrypted.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: hubble-ui-security
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: hubble-ui-route
  oidc:
    provider:
      issuer: https://auth.3istor.com/realms/3istor
      authorizationEndpoint: https://auth.3istor.com/realms/3istor/protocol/openid-connect/auth
      tokenEndpoint: https://auth.3istor.com/realms/3istor/protocol/openid-connect/token
      backendRefs:
        - group: ""
          kind: Service
          name: keycloakx-http
          namespace: keycloak
          port: 80
    clientID: 3-istor-openid
    clientSecret:
      name: hubble-ui-envoy-auth-secret
    redirectURL: https://hubble.3istor.com/oauth2/callback
    logoutPath: /logout
    forwardAccessToken: true
  jwt:
    providers:
      - name: keycloak-3istor
        issuer: https://auth.3istor.com/realms/3istor
        remoteJWKS:
          uri: https://auth.3istor.com/realms/3istor/protocol/openid-connect/certs
  authorization:
    defaultAction: Deny
    rules:
      - name: platform-roles
        action: Allow
        principal:
          jwt:
            provider: keycloak-3istor
            claims:
              - name: groups
                valueType: StringArray
                values: [infra, security-auditor]
---
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: hubble-ui-envoy-auth-secret
spec:
  path: kvv2/observability/envoy-auth
  vaultRole: observability-role
  keys:
    - client-secret
  type: Opaque
