# CNP-185 V1 cutover. The old Service names stay, their pods change: every
# consumer not yet moved to VMSingle (vmalert, Grafana, Argo Rollouts,
# OpenCost, the CMP, project Grafana orgs, WireGuard relays, secret-age)
# reaches the new stack without a config change. Rollback: comment the patch
# out in kustomization.yaml, the selectors go back to the old pods.
apiVersion: v1
kind: Service
metadata:
  name: vm-victoria-metrics-cluster-vmselect
  namespace: observability
spec:
  selector:
    $patch: replace
    app.kubernetes.io/name: vmauth
    app.kubernetes.io/instance: compat
---
apiVersion: v1
kind: Service
metadata:
  name: vm-victoria-metrics-cluster-vminsert
  namespace: observability
spec:
  selector:
    $patch: replace
    app.kubernetes.io/name: vmauth
    app.kubernetes.io/instance: compat
---
apiVersion: v1
kind: Service
metadata:
  name: vm-victoria-metrics-cluster-vmauth
  namespace: observability
spec:
  selector:
    $patch: replace
    app.kubernetes.io/name: vmauth
    app.kubernetes.io/instance: projects
