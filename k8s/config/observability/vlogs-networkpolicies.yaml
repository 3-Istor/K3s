# VictoriaLogs has no authentication of its own and serves ingestion,
# queries and admin on one port (D7, D8). Admin endpoints also need
# ADMIN_AUTH_KEY; projects only reach it through vmauth-projects, whose url_map
# lets the query paths through and nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vlogs-clients
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vlsingle
      app.kubernetes.io/instance: cnp
  policyTypes: [Ingress]
  ingress:
    - from:
        # The only writer. The cloud relays will come through vmauth (D22).
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: fluent-bit
        # Readers, and the scrape of VictoriaLogs' own metrics.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
              app.kubernetes.io/instance: cnp
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmauth
              app.kubernetes.io/instance: projects
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmalert
              app.kubernetes.io/instance: vlogs
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: audit-archive-vlogs
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: arcl-cmp
          podSelector:
            matchLabels:
              app.kubernetes.io/component: backend
              app.kubernetes.io/name: arcl-cmp
      ports:
        - port: 9428
---
# Recording rules and alert state. Adds to vmsingle-clients, which stays as
# V1 wrote it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vmsingle-vmalert-vlogs
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vmsingle
      app.kubernetes.io/instance: cnp
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmalert
              app.kubernetes.io/instance: vlogs
      ports:
        - port: 8429
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vmalert-vlogs-scrape-only
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vmalert
      app.kubernetes.io/instance: vlogs
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
              app.kubernetes.io/instance: cnp
---
# Fluent Bit's HTTP server only serves metrics and health, but it is there.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fluent-bit-scrape-only
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fluent-bit
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
              app.kubernetes.io/instance: cnp
      ports:
        - port: 2020
