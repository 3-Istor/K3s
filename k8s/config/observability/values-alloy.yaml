alloy:
  extraEnv:
    - name: ALLOY_LOKI_PASSWORD
      valueFrom:
        secretKeyRef:
          name: loki-clients
          key: ALLOY_LOKI_PASSWORD

  mounts:
    extra:
      - name: k3s-server-logs
        mountPath: /var/lib/rancher/k3s/server/logs
        readOnly: true

  # 1200Mi while it also scraped every metric (CNP-272). Logs only since
  # CNP-185 V1, which targets under 300Mi: resize on 7 days of usage.
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 512Mi

  configMap:
    create: true
    content: |-
      discovery.kubernetes "pods" {
        role = "pod"
        attach_metadata {
          namespace = true
        }
      }

      // ---------------------------------------------------------------
      // Logs
      // ---------------------------------------------------------------

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace_label_cnp_3istor_com_project"]
          regex         = "(.+)"
          target_label  = "project"
        }

        // The app's own setting first, then the namespace's, so a project
        // that sets one overrides its apps.
        rule {
          source_labels = ["__meta_kubernetes_pod_label_cnp_3istor_com_log_retention"]
          target_label  = "__tmp_retention"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace_label_cnp_3istor_com_log_retention"]
          regex         = "(.+)"
          target_label  = "__tmp_retention"
        }

        // Only the periods Loki's retention_stream knows; anything else falls
        // back to the 14d default instead of creating a new stream label value.
        rule {
          source_labels = ["__tmp_retention"]
          regex         = "(7d|14d|30d)"
          target_label  = "retention"
        }
      }

      loki.source.kubernetes "local_logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.projects.receiver]
      }

      // Counts every project line, and its error lines, as metrics for
      // VictoriaMetrics (log volume and error alerts work whatever tenant the
      // lines land in), then sends each project's lines to its own Loki
      // tenant. Everything else stays in "default".
      loki.process "projects" {
        stage.match {
          selector = "{project=~\".+\"}"

          stage.metrics {
            metric.counter {
              name              = "log_lines_total"
              description       = "Log lines per project namespace."
              match_all         = true
              action            = "inc"
              max_idle_duration = "24h"
            }
            metric.counter {
              name              = "log_bytes_total"
              description       = "Log bytes per project namespace."
              match_all         = true
              count_entry_bytes = true
              action            = "add"
              max_idle_duration = "24h"
            }
          }

          stage.match {
            selector = "{project=~\".+\"} |~ \"(?i)\\\\b(error|fatal|panic|exception|traceback)\\\\b\""

            stage.metrics {
              metric.counter {
                name              = "log_error_lines_total"
                description       = "Log lines that look like errors, per project namespace."
                match_all         = true
                action            = "inc"
                max_idle_duration = "24h"
              }
            }
          }

          stage.tenant {
            label = "project"
          }
        }
        forward_to = [loki.write.local_loki.receiver]
      }

      // The counters above are exported on Alloy's own /metrics, which
      // vmagent scrapes (VMPodScrape alloy).

      // Kubernetes API audit log, only present on the K3s server node.
      local.file_match "k8s_audit" {
        path_targets = [{
          __path__  = "/var/lib/rancher/k3s/server/logs/audit.log",
          job       = "k8s-audit",
          retention = "30d",
        }]
      }

      loki.source.file "k8s_audit" {
        targets    = local.file_match.k8s_audit.targets
        forward_to = [loki.write.local_loki.receiver]
      }

      loki.write "local_loki" {
        external_labels = {cluster = "onprem"}

        endpoint {
          url       = "http://loki-gateway.observability.svc.cluster.local/loki/api/v1/push"
          tenant_id = "default"

          basic_auth {
            username = "alloy"
            password = sys.env("ALLOY_LOKI_PASSWORD")
          }
        }
      }

configReloader:
  resources:
    requests:
      cpu: 10m
      memory: 50Mi
    limits:
      cpu: 100m
      memory: 50Mi

controller:
  volumes:
    extra:
      - name: k3s-server-logs
        hostPath:
          path: /var/lib/rancher/k3s/server/logs
          type: DirectoryOrCreate
