alloy:
  resources:
    requests:
      cpu: 50m
      memory: 1000Mi
    limits:
      cpu: 500m
      memory: 1000Mi

  configMap:
    create: true
    content: |-
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.kubernetes "nodes" {
        role = "node"
      }

      // ---------------------------------------------------------------
      // Logs
      // ---------------------------------------------------------------

      loki.source.kubernetes "local_logs" {
        targets    = discovery.kubernetes.pods.targets
        forward_to = [loki.process.add_tenant.receiver]
      }

      loki.process "add_tenant" {
        stage.match {
          selector = "{namespace=~\"project-.*|demo-app|n8n\"}"
          stage.tenant {
            label = "tenant"
          }
        }
        forward_to = [loki.write.local_loki.receiver]
      }

      loki.write "local_loki" {
        endpoint {
          url       = "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push"
          tenant_id = "default"
        }
      }

      // ---------------------------------------------------------------
      // Metrics: pods that explicitly opt in via prometheus.io annotations
      // ---------------------------------------------------------------

      discovery.relabel "annotated_pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
          regex         = "true"
          action        = "keep"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_phase"]
          regex         = "Succeeded|Failed"
          action        = "drop"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
          regex         = "(.+)"
          target_label  = "__metrics_path__"
        }

        // Rewrite the target address to the annotated port instead of every
        // container port discovered on the pod.
        rule {
          source_labels = ["__address__", "__meta_kubernetes_pod_annotation_prometheus_io_port"]
          regex         = "([^:]+)(?::\\d+)?;(\\d+)"
          replacement   = "$1:$2"
          target_label  = "__address__"
          action        = "replace"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
      }

      prometheus.scrape "annotated_pods" {
        targets    = discovery.relabel.annotated_pods.output
        job_name   = "kubernetes-pods"
        forward_to = [prometheus.remote_write.vmauth.receiver]
      }

      // ---------------------------------------------------------------
      // Metrics: kubelet + cAdvisor (container CPU/memory, volume stats)
      // ---------------------------------------------------------------

      discovery.relabel "kubelet" {
        targets = discovery.kubernetes.nodes.targets

        rule {
          target_label = "__address__"
          replacement  = "kubernetes.default.svc.cluster.local:443"
        }

        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          regex         = "(.+)"
          replacement   = "/api/v1/nodes/$1/proxy/metrics"
          target_label  = "__metrics_path__"
        }

        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          target_label  = "node"
        }

        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          target_label  = "instance"
        }
      }

      discovery.relabel "cadvisor" {
        targets = discovery.kubernetes.nodes.targets

        rule {
          target_label = "__address__"
          replacement  = "kubernetes.default.svc.cluster.local:443"
        }

        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          regex         = "(.+)"
          replacement   = "/api/v1/nodes/$1/proxy/metrics/cadvisor"
          target_label  = "__metrics_path__"
        }

        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          target_label  = "node"
        }

        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          target_label  = "instance"
        }
      }

      prometheus.scrape "kubelet" {
        targets          = discovery.relabel.kubelet.output
        job_name         = "kubelet"
        scheme           = "https"
        scrape_interval  = "30s"
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        tls_config {
          ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        }
        forward_to = [prometheus.remote_write.vmauth.receiver]
      }

      prometheus.scrape "cadvisor" {
        targets          = discovery.relabel.cadvisor.output
        job_name         = "cadvisor"
        scheme           = "https"
        scrape_interval  = "30s"
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        tls_config {
          ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        }
        forward_to = [prometheus.remote_write.vmauth.receiver]
      }

      // ---------------------------------------------------------------
      // Metrics: kube-apiserver
      // ---------------------------------------------------------------

      prometheus.scrape "apiserver" {
        targets = [{
          __address__ = "kubernetes.default.svc.cluster.local:443",
          job         = "apiserver",
        }]
        metrics_path      = "/metrics"
        scheme            = "https"
        scrape_interval   = "30s"
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        tls_config {
          ca_file     = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          server_name = "kubernetes.default.svc"
        }
        forward_to = [prometheus.remote_write.vmauth.receiver]
      }

      // ---------------------------------------------------------------
      // Metrics: ServiceMonitor / PodMonitor CRDs
      // ---------------------------------------------------------------

      prometheus.operator.podmonitors "local_pods" {
        forward_to = [prometheus.remote_write.vmauth.receiver]
      }

      prometheus.operator.servicemonitors "local_services" {
        forward_to = [prometheus.remote_write.vmauth.receiver]
      }

      prometheus.remote_write "vmauth" {
        endpoint {
          url = "http://vm-victoria-metrics-cluster-vminsert.observability.svc.cluster.local:8480/insert/0/prometheus/api/v1/write"
        }
      }

# The kubelet/cAdvisor scrapes go through the apiserver proxy so TLS can be
# verified against the ServiceAccount CA. K3s signs kubelet serving certs with
# a different CA, so scraping port 10250 directly would require skipping
# verification. The chart's default clusterRules omit nodes/proxy.
rbac:
  clusterRules:
    - apiGroups: [""]
      resources: ["nodes"]
      verbs: ["get", "list", "watch"]
    - apiGroups: [""]
      resources: ["nodes/pods"]
      verbs: ["get", "list", "watch"]
    - apiGroups: [""]
      resources: ["nodes/metrics"]
      verbs: ["get", "list", "watch"]
    - apiGroups: [""]
      resources: ["nodes/proxy"]
      verbs: ["get", "list", "watch"]
    - nonResourceURLs: ["/metrics"]
      verbs: ["get"]

configReloader:
  resources:
    requests:
      cpu: 10m
      memory: 50Mi
    limits:
      cpu: 100m
      memory: 50Mi
