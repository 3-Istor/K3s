apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Instead of `namespace: observability`, which would also rename the
# cnp-observability Namespace object to observability.
transformers:
  - namespace-transformer.yaml

resources:
  - namespace.yaml
  - secrets.yaml
  - loki-archive-buckets.yaml
  - audit-archive.yaml
  - secret-age.yaml
  - cmp-archive-status.yaml
  - vmauth-projects.yaml
  - vm-networkpolicies.yaml
  - exporters.yaml
  - vmalert-rules.yaml
  - vmsingle.yaml
  - vmagent.yaml
  - vmagent-scrapes.yaml
  - vmauth.yaml
  - vm-service-names.yaml
  # V2 logs (CNP-185): VictoriaLogs, Fluent Bit, vmalert for LogsQL rules
  - vlogs.yaml
  - fluent-bit.yaml
  - vlogs-networkpolicies.yaml
  - vlogs-rules.yaml
  - vmalert-vlogs.yaml
  - audit-archive-vlogs.yaml
  # V4 traces
  - vtraces.yaml
  - otelcol-gateway-deploy.yaml
  - traces-networkpolicies.yaml
  - traces-scrapes.yaml
  - hubble-ui-route.yaml
  # V3 alerting (CNP-185): VMAlert and VMAlertmanager replace the Helm
  # vmalert and Alertmanager, CMP RBAC, vmauth keys, vmauth for the clouds
  - vmalert.yaml
  - alertmanager.yaml
  - alerting-rules.yaml
  - ai-rules.yaml
  - alerting-networkpolicies.yaml
  - cmp-observability-rbac.yaml
  - vmauth-keys.yaml
  - vmauth-clouds.yaml

# Upstream alerts kept from the default set: node-exporter, kube-state-metrics,
# VictoriaMetrics self-health and Alertmanager. The rest of the Kubernetes
# mixin fires all the time on two nodes, and K3s has no etcd, scheduler or
# controller-manager endpoints.
configMapGenerator:
  - name: vmalert-default-rules
    # VMAlert cnp mounts it at a fixed path; its config reloader watches it
    # (V3 alerting).
    options:
      disableNameSuffixHash: true
    files:
      - default-rules/alertmanager.yaml
      - default-rules/kube-state-metrics.yaml
      - default-rules/node-exporter.yaml
      - default-rules/vm-health.yaml
      - default-rules/vmagent.yaml
      - default-rules/vmalert.yaml
      - default-rules/vmoperator.yaml
      - default-rules/vmsingle.yaml
      # V4 traces
      - default-rules/traces.yaml
      # CNP-302, written here rather than vendored
      - backing-rules/backing.yaml
  - name: otelcol-gateway
    files:
      - otelcol-gateway/config.yaml
  - name: grafana-dashboard-ia
    options:
      disableNameSuffixHash: true
    files:
      - ia.json=dashboards/ia.json

helmGlobals:
  chartHome: ../../../charts

helmCharts:
  - name: secure-route
    releaseName: observability-routes
    namespace: observability
    valuesFile: values-secure-route.yaml

  - name: victoria-metrics-operator
    repo: https://victoriametrics.github.io/helm-charts/
    version: 0.68.2
    releaseName: vm-operator
    namespace: observability
    valuesFile: values-vm-operator.yaml

  # Grafana (Visualisation)
  - name: grafana
    repo: https://grafana.github.io/helm-charts
    version: 10.5.15
    releaseName: grafana
    namespace: observability
    valuesFile: values-grafana.yaml
    # V2 logs (CNP-185)
    additionalValuesFiles:
      - values-grafana-vlogs.yaml

  # Official Prometheus Operator CRDs
  - name: prometheus-operator-crds
    repo: https://prometheus-community.github.io/helm-charts
    version: 31.0.1
    releaseName: prometheus-operator-crds
    namespace: observability
    valuesFile: values-prometheus-operator-crds.yaml
