deploymentMode: SingleBinary
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0

chunksCache:
  enabled: false
resultsCache:
  enabled: false

# kustomize renders Helm test hooks as plain Pods, so ArgoCD would deploy them
# as permanent workloads.
test:
  enabled: false

# The canary writes ~40MB of logs per node back into Loki itself.
lokiCanary:
  enabled: false

# Loki has no authentication of its own: every client goes through this
# nginx with its own basic-auth user (K3s/terraform/loki.tf), and a
# NetworkPolicy keeps everyone else off the Loki pods.
gateway:
  enabled: true
  replicas: 1
  basicAuth:
    enabled: true
    existingSecret: loki-gateway-htpasswd
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 32Mi

sidecar:
  rules:
    folder: /rules/default
  resources:
    requests:
      cpu: 10m
      # loki-sc-rules was OOMKilled 551 times at 64Mi. kiwigrid/k8s-sidecar's
      # own memory footprint grew significantly across versions
      # (kiwigrid/k8s-sidecar#462); the chart's own documented baseline is
      # 100Mi, and we're on 2.5.0 (newer than the version that regressed),
      # so keeping headroom above that baseline rather than the bare minimum.
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 128Mi

loki:
  auth_enabled: true # Enable Multi-Tenancy

  commonConfig:
    replication_factor: 1

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h

  # Default retention is 14d. Alloy sets a `retention` stream label from
  # cnp.3istor.com/log-retention (project overrides app); only the values
  # below are honoured, so the label stays low-cardinality.
  compactor:
    retention_enabled: true
    delete_request_store: s3

  limits_config:
    retention_period: 336h
    retention_stream:
      - selector: '{retention="7d"}'
        priority: 1
        period: 168h
      - selector: '{retention="30d"}'
        priority: 1
        period: 720h

  # 5000 audit events (~860 bytes each) overflow the default 4MiB gRPC message
  # between querier and frontend, and Loki retries forever instead of failing.
  server:
    http_listen_port: 3100
    grpc_listen_port: 9095
    http_server_read_timeout: 600s
    http_server_write_timeout: 600s
    grpc_server_max_recv_msg_size: 16777216
    grpc_server_max_send_msg_size: 16777216

  structuredConfig:
    frontend_worker:
      grpc_client_config:
        max_send_msg_size: 16777216
        max_recv_msg_size: 16777216

  # Rules come from ConfigMaps through the sidecar, not object storage.
  rulerConfig:
    alertmanager_url: http://alertmanager.observability.svc:9093
    enable_api: true
    wal:
      dir: /var/loki/ruler-wal
    storage:
      type: local
      local:
        directory: /rules

  storage:
    type: s3
    bucketNames:
      chunks: "loki-data"
      ruler: "loki-data"
      admin: "loki-data"
    s3:
      # The OpenStack Ceph RGW, through the loki-data ObjectBucketClaim.
      endpoint: "192.168.1.110:7480"
      insecure: true
      accessKeyId: "${AWS_ACCESS_KEY_ID}"
      secretAccessKey: "${AWS_SECRET_ACCESS_KEY}"
      s3ForcePathStyle: true

singleBinary:
  replicas: 1
  extraArgs:
    - "-config.expand-env=true"
  # 1Gi was not enough to replay the WAL that built up while flushes were
  # failing, so the pod was OOMKilled on every start.
  resources:
    requests:
      cpu: 50m
      memory: 2Gi
    limits:
      cpu: 500m
      memory: 2Gi

  persistence:
    enabled: true
    storageClass: "ceph-block"
    size: 20Gi

  extraEnvFrom:
    - secretRef:
        name: loki-data
