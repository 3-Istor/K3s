deploymentMode: SingleBinary
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0

chunksCache:
  enabled: false
resultsCache:
  enabled: false

# kustomize renders Helm test hooks as plain Pods, so ArgoCD would deploy them
# as permanent workloads.
test:
  enabled: false

# The canary writes ~40MB of logs per node back into Loki itself.
lokiCanary:
  enabled: false

# SingleBinary exposes everything on the loki service already.
gateway:
  enabled: false

sidecar:
  resources:
    requests:
      cpu: 10m
      # loki-sc-rules was OOMKilled 551 times at 64Mi. kiwigrid/k8s-sidecar's
      # own memory footprint grew significantly across versions
      # (kiwigrid/k8s-sidecar#462); the chart's own documented baseline is
      # 100Mi, and we're on 2.5.0 (newer than the version that regressed),
      # so keeping headroom above that baseline rather than the bare minimum.
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 128Mi

loki:
  auth_enabled: true # Enable Multi-Tenancy

  commonConfig:
    replication_factor: 1

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h

  storage:
    type: s3
    bucketNames:
      chunks: "loki-data"
      ruler: "loki-data"
      admin: "loki-data"
    s3:
      # Must be the in-cluster Service, not s3.3istor.com. That hostname resolves
      # to Envoy Gateway, which normalises headers in transit and invalidates the
      # SigV4 signature, so every PutObject came back as 403 Invalid signature.
      endpoint: "garage.garage-s3.svc.cluster.local:3900"
      insecure: true
      region: "garage"
      accessKeyId: "${S3_ACCESS_KEY}"
      secretAccessKey: "${S3_SECRET_KEY}"
      s3ForcePathStyle: true

singleBinary:
  replicas: 1
  extraArgs:
    - "-config.expand-env=true"
  # 1Gi was not enough to replay the WAL that built up while flushes were
  # failing, so the pod was OOMKilled on every start.
  resources:
    requests:
      cpu: 50m
      memory: 2Gi
    limits:
      cpu: 500m
      memory: 2Gi

  persistence:
    enabled: true
    storageClass: "ceph-block"
    size: 20Gi

  extraEnvFrom:
    - secretRef:
        name: observability-secrets
