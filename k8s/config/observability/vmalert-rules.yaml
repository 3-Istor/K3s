apiVersion: v1
kind: ConfigMap
metadata:
  name: vmalert-rules
  namespace: observability
data:
  alert-rules.yaml: |
    groups:
      - name: app-golden-signals.rules
        rules:
          # =====================================================================
          # 1. POD HEALTH & SATURATION (USE Method via cAdvisor & KSM)
          # =====================================================================

          # Early Warning: Memory close to limit (OOMKill Risk)
          - alert: AppPodMemoryCloseToLimit
            expr: |
              (
                container_memory_working_set_bytes{container!="", namespace!~"kube-system|observability|kyverno|envoy-gateway-system|cert-manager|rook-ceph|argocd"}
                / on(container, pod, namespace)
                kube_pod_container_resource_limits{resource="memory"}
              ) > 0.85
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Container {{ $labels.container }} ({{ $labels.namespace }}) is close to its memory limit"
              description: "Memory usage is at {{ $value | humanizePercentage }} of its limit in pod {{ $labels.pod }}."

          # Critical: Container was OOMKilled (Out Of Memory)
          - alert: AppContainerOOMKilled
            expr: |
              kube_pod_container_status_terminated_reason{reason="OOMKilled", namespace!~"kube-system|observability|kyverno|envoy-gateway-system|cert-manager|rook-ceph|argocd"} == 1
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: "Container {{ $labels.container }} ({{ $labels.namespace }}) was OOMKilled"
              description: "The container {{ $labels.container }} in pod {{ $labels.pod }} was terminated due to memory exhaustion."

          # Early Warning: High CPU Throttling (Hidden CPU Saturation causing slow response times)
          - alert: AppPodCPUThrottlingHigh
            expr: |
              (
                sum(increase(container_cpu_cfs_throttled_periods_total{container!="", namespace!~"kube-system|observability|kyverno|envoy-gateway-system|cert-manager|rook-ceph|argocd"}[5m])) by (container, pod, namespace)
                /
                sum(increase(container_cpu_cfs_periods_total{container!=""}[5m])) by (container, pod, namespace)
              ) > 0.25
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Container {{ $labels.container }} ({{ $labels.namespace }}) is experiencing heavy CPU throttling"
              description: "CPU is throttled for {{ $value | humanizePercentage }} of execution periods in pod {{ $labels.pod }}."

          # Reactive Alert: Frequent Pod Restarts (Signals a CrashLoop or unhandled exceptions)
          - alert: AppPodRestartsHigh
            expr: |
              increase(kube_pod_container_status_restarts_total{namespace!~"kube-system|observability|kyverno|envoy-gateway-system|cert-manager|rook-ceph|argocd"}[1h]) > 2
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.pod }} ({{ $labels.namespace }}) is restarting frequently"
              description: "Pod {{ $labels.pod }} has restarted {{ $value }} times over the last hour."

          # Reactive Alert: Pod stuck out of Running/Succeeded for a long time
          - alert: AppPodNotReady
            expr: |
              sum by (namespace, pod) (
                kube_pod_status_phase{phase=~"Pending|Unknown|Failed", namespace!~"kube-system|observability|kyverno|envoy-gateway-system|cert-manager|rook-ceph|argocd"}
              ) > 0
            for: 20m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.pod }} ({{ $labels.namespace }}) has been non-ready for 20 minutes"
              description: "Pod {{ $labels.pod }} is stuck in a non-running phase."

          # Reactive Alert: Deployment cannot reach its desired replica count
          - alert: AppDeploymentReplicasMismatch
            expr: |
              (
                kube_deployment_spec_replicas{namespace!~"kube-system|observability|kyverno|envoy-gateway-system|cert-manager|rook-ceph|argocd"}
                != on(namespace, deployment)
                kube_deployment_status_replicas_available{namespace!~"kube-system|observability|kyverno|envoy-gateway-system|cert-manager|rook-ceph|argocd"}
              )
              and on(namespace, deployment)
              changes(kube_deployment_status_replicas_updated[10m]) == 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Deployment {{ $labels.deployment }} ({{ $labels.namespace }}) has not converged"
              description: "Desired and available replica counts have differed for 15 minutes."

          # =====================================================================
          # 2. PERSISTENT STORAGE (USE Method via Kubelet)
          # =====================================================================

          # Early Warning: Rook-Ceph PVC nearly full (Database, uploads, etc.)
          - alert: AppPVCFillingUp
            expr: |
              (
                kubelet_volume_stats_available_bytes{namespace!~"kube-system|observability|kyverno|envoy-gateway-system|cert-manager|rook-ceph|argocd"}
                /
                kubelet_volume_stats_capacity_bytes{}
              ) < 0.15
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "Volume {{ $labels.persistentvolumeclaim }} ({{ $labels.namespace }}) is almost full"
              description: "Less than 15% of storage capacity (currently {{ $value | humanizePercentage }}) is left on the PVC."

          # Early Warning: PVC will run out of space within 4 days at the current rate
          - alert: AppPVCWillFillUp
            expr: |
              predict_linear(kubelet_volume_stats_available_bytes[6h], 4 * 24 * 3600) < 0
              and
              (kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes) < 0.4
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: "Volume {{ $labels.persistentvolumeclaim }} ({{ $labels.namespace }}) is projected to fill up"
              description: "At the current growth rate the PVC runs out of space within 4 days."

          # =====================================================================
          # 3. TRAFFIC & USER EXPERIENCE (RED / Blackbox Method via Envoy & Gatus)
          # =====================================================================

          # Alert: High HTTP 5xx rate on Gateway (RED - Errors)
          - alert: GatewayHighHTTP5xxRate
            expr: |
              (
                sum(rate(envoy_http_downstream_rq_xx{envoy_response_code_class="5"}[5m]))
                /
                sum(rate(envoy_http_downstream_rq_xx[5m]))
              ) > 0.05
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "High HTTP 5xx error rate on Envoy Gateway"
              description: "Envoy Gateway reports a 5xx error rate of {{ $value | humanizePercentage }} over the last 5 minutes."

          # Alert: Connection failures from Envoy Gateway to Backend services
          - alert: GatewayUpstreamConnectionFailures
            expr: |
              sum(rate(envoy_cluster_upstream_cx_connect_fail{}[5m])) by (envoy_cluster_name) > 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Envoy Gateway failed to connect to upstream {{ $labels.envoy_cluster_name }}"
              description: "Envoy Gateway is experiencing network connection failures to upstream application cluster {{ $labels.envoy_cluster_name }}."

          # Blackbox Alert: Downtime detected by Gatus
          - alert: GatusEndpointDown
            expr: |
              sum(increase(gatus_results_total{success="false"}[5m])) by (name, group) >= 3
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Endpoint {{ $labels.name }} (group {{ $labels.group }}) is failing"
              description: "Gatus has recorded at least 3 failed checks over the last 5 minutes for {{ $labels.name }}."

      # =====================================================================
      # 4. NODE & CLUSTER HEALTH (node-exporter + kube-state-metrics)
      # =====================================================================
      - name: infrastructure.rules
        rules:
          - alert: NodeNotReady
            expr: |
              kube_node_status_condition{condition="Ready", status="true"} == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Node {{ $labels.node }} is NotReady"
              description: "The node has been reporting NotReady for 5 minutes."

          - alert: NodeMemoryPressure
            expr: |
              (
                1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
              ) > 0.90
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Node {{ $labels.instance }} is low on memory"
              description: "Memory usage is at {{ $value | humanizePercentage }}."

          - alert: NodeDiskFillingUp
            expr: |
              (
                1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"})
              ) > 0.85
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} is almost full"
              description: "Disk usage is at {{ $value | humanizePercentage }}."

          - alert: NodeCPUSaturated
            expr: |
              (
                1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))
              ) > 0.90
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "Node {{ $labels.instance }} CPU is saturated"
              description: "CPU usage has been above 90% for 30 minutes (currently {{ $value | humanizePercentage }})."

          - alert: NodeClockSkew
            expr: |
              abs(node_timex_offset_seconds) > 0.05
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Clock skew detected on {{ $labels.instance }}"
              description: "The node clock is drifting by {{ $value }}s, which breaks TLS and token validation."

      # =====================================================================
      # 5. OBSERVABILITY SELF-MONITORING
      # =====================================================================
      - name: observability-self.rules
        rules:
          - alert: ScrapeTargetDown
            expr: up == 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Scrape target {{ $labels.job }} ({{ $labels.instance }}) is down"
              description: "Alloy has been unable to scrape this target for 15 minutes."

          - alert: LokiIngestionStalled
            expr: |
              sum(rate(loki_ingester_chunks_flushed_total[15m])) == 0
              and
              sum(rate(loki_distributor_lines_received_total[15m])) > 0
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "Loki is receiving logs but flushing nothing to object storage"
              description: "Ingestion is stalled, which usually means the S3 credentials or the bucket are broken."

          - alert: VMStorageInsertErrors
            expr: |
              sum(rate(vm_rows_ignored_total[10m])) > 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "VictoriaMetrics is dropping rows"
              description: "vmstorage is ignoring incoming samples, check vminsert and vmstorage logs."

          - alert: AlertmanagerNotificationsFailing
            expr: |
              rate(alertmanager_notifications_failed_total[10m]) > 0
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: "Alertmanager cannot deliver notifications to {{ $labels.integration }}"
              description: "Alerts are firing but the Discord webhook is rejecting them."
