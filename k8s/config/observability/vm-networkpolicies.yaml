# VictoriaMetrics has no authentication of its own. Project Grafana orgs go
# through vmauth, which filters each project to its namespaces; these keep
# every other pod from reading or writing metrics around it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vmselect-readers
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: vm
      app.kubernetes.io/component: vmselect
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: vm
              app.kubernetes.io/component: vmauth
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: victoria-metrics-alert
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vminsert-writers
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: vm
      app.kubernetes.io/component: vminsert
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: victoria-metrics-alert
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vmstorage-cluster-only
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: vm
      app.kubernetes.io/component: vmstorage
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: vm
              app.kubernetes.io/component: vminsert
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: vm
              app.kubernetes.io/component: vmselect
