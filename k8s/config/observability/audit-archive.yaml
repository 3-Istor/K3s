# Hourly copy of the audit streams (Kubernetes API, Vault, Keycloak events) to
# a bucket with Object Lock in COMPLIANCE mode: nothing holding S3 or Kubernetes
# credentials can delete or shorten an archived hour for 30 days. A Ceph admin
# on the OpenStack nodes still can (radosgw-admin), so this covers a compromised
# cluster, not a compromised storage host.
apiVersion: ceph.rook.io/v1
kind: CephObjectStoreUser
metadata:
  name: audit-archive
spec:
  store: openstack-rgw
  clusterNamespace: rook-ceph
  displayName: CNP audit archive
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-archive-scripts
data:
  export.sh: |
    set -eu
    # The hour that ended before this run, so late lines have had minutes to land.
    now=$(date +%s)
    end=$((now - now % 3600))
    start=$((end - 3600))
    from=$(date -u -d "@$start" +%Y-%m-%dT%H:%M:%SZ)
    to=$(date -u -d "@$end" +%Y-%m-%dT%H:%M:%SZ)
    date -u -d "@$start" +%Y/%m/%d/%H > /work/hour
    export_stream() {
      # Batches of 1000: 5000 audit events overflow Loki's 4MiB gRPC messages.
      logcli query --addr=http://loki.observability.svc:3100 --org-id=default \
        --from="$from" --to="$to" --limit=10000000 --batch=1000 --forward \
        --output=jsonl --quiet "$2" | gzip > "/work/$1.jsonl.gz"
      echo "$1: $(gzip -dc "/work/$1.jsonl.gz" | wc -l) lines for $from"
    }
    export_stream k8s-audit '{job="k8s-audit"}'
    export_stream vault '{namespace="vault", container="vault"} |= `"type":"response"`'
    export_stream keycloak '{namespace=~"keycloak|.+-system"} |= `org.keycloak.events`'
  upload.sh: |
    set -eu
    s3() { aws --endpoint-url "http://$Endpoint" "$@"; }
    export AWS_ACCESS_KEY_ID="$AccessKey" AWS_SECRET_ACCESS_KEY="$SecretKey"
    bucket=cnp-audit-archive
    # Object Lock can only be switched on when the bucket is created.
    if ! s3 s3api head-bucket --bucket "$bucket" 2>/dev/null; then
      s3 s3api create-bucket --bucket "$bucket" --object-lock-enabled-for-bucket
      s3 s3api put-object-lock-configuration --bucket "$bucket" \
        --object-lock-configuration '{"ObjectLockEnabled":"Enabled","Rule":{"DefaultRetention":{"Mode":"COMPLIANCE","Days":30}}}'
    fi
    hour=$(cat /work/hour)
    for f in /work/*.jsonl.gz; do
      key="audit/$(basename "$f" .jsonl.gz)/$hour.jsonl.gz"
      s3 s3api put-object --bucket "$bucket" --key "$key" --body "$f" \
        --content-type application/gzip --output text --query VersionId
      echo "uploaded $key"
    done
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: audit-archive
spec:
  schedule: "7 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: work
              emptyDir: {}
            - name: scripts
              configMap:
                name: audit-archive-scripts
          initContainers:
            - name: export
              image: grafana/logcli:3.7.8
              command: ["sh", "/scripts/export.sh"]
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: scripts
                  mountPath: /scripts
              resources:
                requests:
                  cpu: 50m
                  memory: 256Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          containers:
            - name: upload
              image: amazon/aws-cli:2.37.4
              command: ["bash", "/scripts/upload.sh"]
              env:
                - name: HOME
                  value: /work
                - name: AWS_DEFAULT_REGION
                  value: us-east-1
              envFrom:
                - secretRef:
                    name: rook-ceph-object-user-openstack-rgw-audit-archive
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: scripts
                  mountPath: /scripts
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
