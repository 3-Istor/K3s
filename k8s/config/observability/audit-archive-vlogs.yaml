# Hourly audit archive from VictoriaLogs (LogsQL): the Kubernetes API, Vault
# and Keycloak event streams, one object per stream and hour under audit/, so
# the bucket's audit/ lifecycle and Object Lock apply (audit-archive.yaml).
# Each line is VictoriaLogs' own JSON ({"_time", "_stream", "_msg"}), _msg
# being the raw log line.
apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-archive-vlogs-scripts
data:
  export.sh: |
    set -eu
    # The hour that ended before this run, so late lines have had minutes to land.
    now=$(date +%s)
    end=$((now - now % 3600))
    start=$((end - 3600))
    date -u -d "@$start" +%Y/%m/%d/%H > /work/hour
    export_stream() {
      : > "/work/$1.jsonl"
      # Ten-minute slices: the sort happens in VictoriaLogs' memory, and an
      # hour of vault responses is ~40MB.
      slice=$start
      while [ "$slice" -lt "$end" ]; do
        from=$(date -u -d "@$slice" +%Y-%m-%dT%H:%M:%SZ)
        to=$(date -u -d "@$((slice + 600))" +%Y-%m-%dT%H:%M:%SZ)
        curl -sSf --max-time 300 http://vlogs-cnp.observability.svc:9428/select/logsql/query \
          --data-urlencode "query=_time:[$from, $to) $2 | sort by (_time) | fields _time, _stream, _msg" \
          >> "/work/$1.jsonl"
        slice=$((slice + 600))
      done
      gzip "/work/$1.jsonl"
      echo "$1: $(gzip -dc "/work/$1.jsonl.gz" | wc -l) lines for $(cat /work/hour)"
    }
    export_stream k8s-audit '{job="k8s-audit"}'
    export_stream vault '{namespace="vault", container="vault"} ~"\"type\":\"response\""'
    export_stream keycloak '{namespace=~"keycloak|.+-system"} ~"org\\.keycloak\\.events"'
  upload.sh: |
    set -eu
    s3() { aws --endpoint-url "$Endpoint" "$@"; }
    export AWS_ACCESS_KEY_ID="$AccessKey" AWS_SECRET_ACCESS_KEY="$SecretKey"
    hour=$(cat /work/hour)
    for f in /work/*.jsonl.gz; do
      key="$ARCHIVE_PREFIX/$(basename "$f" .jsonl.gz)/$hour.jsonl.gz"
      s3 s3api put-object --bucket cnp-audit-archive --key "$key" --body "$f" \
        --content-type application/gzip --output text --query VersionId
      echo "uploaded $key"
    done
---
apiVersion: batch/v1
kind: CronJob
metadata:
  # The CMP's platform view reads this name (cmp-archive-status.yaml).
  name: audit-archive
spec:
  schedule: "7 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: audit-archive-vlogs
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: work
              emptyDir: {}
            - name: scripts
              configMap:
                name: audit-archive-vlogs-scripts
          initContainers:
            - name: export
              image: curlimages/curl:8.17.0
              command: ["sh", "/scripts/export.sh"]
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: scripts
                  mountPath: /scripts
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          containers:
            - name: upload
              image: amazon/aws-cli:2.27.0
              command: ["bash", "/scripts/upload.sh"]
              env:
                - name: HOME
                  value: /work
                - name: AWS_DEFAULT_REGION
                  value: us-east-1
                - name: ARCHIVE_PREFIX
                  value: audit
              envFrom:
                - secretRef:
                    name: rook-ceph-object-user-openstack-rgw-audit-archive
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: scripts
                  mountPath: /scripts
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
