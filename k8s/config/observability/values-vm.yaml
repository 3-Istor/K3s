vmstorage:
  replicaCount: 1
  resources:
    requests:
      memory: "1Gi"
      cpu: "50m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  # 10Gi with the default 1-month retention filled up on 2026-10-05 and
  # vmstorage went read-only: no metrics were kept for five days. The volume
  # was grown in place (StatefulSet volume templates are immutable: recreate
  # the StatefulSet with --cascade=orphan after changing the size).
  retentionPeriod: "14d"
  storageDataPath: "/storage"
  persistentVolume:
    enabled: true
    storageClassName: "ceph-block"
    size: "20Gi"

vminsert:
  replicaCount: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

vmselect:
  replicaCount: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# VMAuth acts as the multi-tenant router
vmauth:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "25m"
    limits:
      memory: "128Mi"
      cpu: "100m"

  config:
    unauthorized_user:
      url_map:
        - src_paths:
            - "/select/[^/]+/prometheus(.*)"
          url_prefix:
            - "http://vm-victoria-metrics-cluster-vmselect:8481/select/0/prometheus$1"

        - src_paths:
            - "/insert/[^/]+/prometheus/api/v1/write"
          url_prefix:
            - "http://vm-victoria-metrics-cluster-vminsert:8480/insert/0/prometheus/api/v1/write"
