# Parked at 0 replicas since the V1 cutover (2026-11-16): the old cluster stopped
# receiving samples on 2026-11-15 ~18:00 UTC. The vmstorage PVC keeps its history
# until CNP-276 removes the chart; scale vmstorage and vmselect back to 1 to read it.
vmstorage:
  replicaCount: 0
  resources:
    requests:
      memory: "1Gi"
      cpu: "50m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  # 10Gi with the default 1-month retention filled up on 2026-10-05 and
  # vmstorage went read-only: no metrics were kept for five days. The volume
  # was grown in place (StatefulSet volume templates are immutable: recreate
  # the StatefulSet with --cascade=orphan after changing the size).
  retentionPeriod: "14d"
  storageDataPath: "/storage"
  persistentVolume:
    enabled: true
    storageClassName: "ceph-rbd"
    size: "20Gi"

vminsert:
  replicaCount: 0
  # The chart lists storage nodes from vmstorage.replicaCount, which is 0.
  extraArgs:
    storageNode: vm-victoria-metrics-cluster-vmstorage-0.vm-victoria-metrics-cluster-vmstorage.observability.svc.cluster.local.:8400
  resources:
    requests:
      memory: "256Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

vmselect:
  replicaCount: 0
  extraArgs:
    storageNode: vm-victoria-metrics-cluster-vmstorage-0.vm-victoria-metrics-cluster-vmstorage.observability.svc.cluster.local.:8401
  # 256Mi got OOMKilled on heavy Grafana queries (CNP-272).
  resources:
    requests:
      memory: "384Mi"
      cpu: "50m"
    limits:
      memory: "384Mi"
      cpu: "200m"

# VMAuth acts as the multi-tenant router
vmauth:
  enabled: true
  replicaCount: 0
  resources:
    requests:
      memory: "128Mi"
      cpu: "25m"
    limits:
      memory: "128Mi"
      cpu: "100m"

  # One user per project, written by the CMP (vmauth-projects.yaml): every
  # query is filtered to the project's namespaces. The anonymous routes that
  # read every namespace are gone.
  configSecretName: vmauth-projects
  extraArgs:
    configCheckInterval: 30s
