vmstorage:
  replicaCount: 1
  resources:
    requests:
      memory: "1Gi"
      cpu: "50m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  # 10Gi with the default 1-month retention filled up on 2026-10-05 and
  # vmstorage went read-only: no metrics were kept for five days. The volume
  # was grown in place (StatefulSet volume templates are immutable: recreate
  # the StatefulSet with --cascade=orphan after changing the size).
  retentionPeriod: "14d"
  storageDataPath: "/storage"
  persistentVolume:
    enabled: true
    storageClassName: "ceph-block"
    size: "20Gi"

vminsert:
  replicaCount: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

vmselect:
  replicaCount: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# VMAuth acts as the multi-tenant router
vmauth:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "25m"
    limits:
      memory: "128Mi"
      cpu: "100m"

  # One user per project, written by the CMP (vmauth-projects.yaml): every
  # query is filtered to the project's namespaces. The anonymous routes that
  # read every namespace are gone.
  configSecretName: vmauth-projects
  extraArgs:
    configCheckInterval: 30s
