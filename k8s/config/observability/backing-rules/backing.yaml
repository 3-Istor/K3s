# Black-box alerts for backing containers (CNP-302): pods labelled
# cnp.3istor.com/role=backing by the CMP at import. Nothing here may name an
# engine: the container can be anything.
# kube_pod_labels carries the role only because kube-state-metrics allowlists
# it (--metric-labels-allowlist in exporters.yaml).
groups:
  - name: backing-containers
    rules:
      - alert: BackingContainerRestarting
        expr: |
          (increase(kube_pod_container_status_restarts_total[15m]) >= 3)
          * on (namespace, pod) group_left ()
          max by (namespace, pod) (kube_pod_labels{label_cnp_3istor_com_role="backing"})
        labels:
          severity: warning
          cnp_role: backing
        annotations:
          summary: "Backing container {{ $labels.container }} ({{ $labels.namespace }}) keeps restarting"
          description: "{{ $value | humanize }} restarts in 15 minutes for pod {{ $labels.pod }}."

      # last_terminated_reason stays OOMKilled after the restart, so the
      # restart counter bounds the alert to recent kills.
      - alert: BackingContainerOOMKilled
        expr: |
          (
            kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
            and on (namespace, pod, container)
            increase(kube_pod_container_status_restarts_total[15m]) > 0
          )
          * on (namespace, pod) group_left ()
          max by (namespace, pod) (kube_pod_labels{label_cnp_3istor_com_role="backing"})
        labels:
          severity: critical
          cnp_role: backing
        annotations:
          summary: "Backing container {{ $labels.container }} ({{ $labels.namespace }}) was OOMKilled"
          description: "Pod {{ $labels.pod }} hit its memory limit in the last 15 minutes. Raise the limit in the app's values or in the CMP."

      - alert: BackingPodNotReady
        expr: |
          (kube_pod_status_ready{condition="false"} == 1)
          * on (namespace, pod) group_left ()
          max by (namespace, pod) (kube_pod_labels{label_cnp_3istor_com_role="backing"})
        for: 10m
        labels:
          severity: critical
          cnp_role: backing
        annotations:
          summary: "Backing pod {{ $labels.pod }} ({{ $labels.namespace }}) is not ready"
          description: "The pod has not been ready for 10 minutes; the apps that depend on it are degraded."

      - alert: BackingVolumeAlmostFull
        expr: |
          (
            max by (namespace, persistentvolumeclaim) (kubelet_volume_stats_used_bytes)
            / max by (namespace, persistentvolumeclaim) (kubelet_volume_stats_capacity_bytes)
          ) > 0.8
          and on (namespace, persistentvolumeclaim)
          max by (namespace, persistentvolumeclaim) (
            kube_pod_spec_volumes_persistentvolumeclaims_info
            * on (namespace, pod) group_left ()
            max by (namespace, pod) (kube_pod_labels{label_cnp_3istor_com_role="backing"})
          )
        for: 15m
        labels:
          severity: warning
          cnp_role: backing
        annotations:
          summary: "Volume {{ $labels.persistentvolumeclaim }} ({{ $labels.namespace }}) of a backing container is over 80% full"
          description: "{{ $value | humanizePercentage }} used."

      - alert: BackingContainerCPUThrottled
        expr: |
          (
            sum by (namespace, pod, container) (rate(container_cpu_cfs_throttled_periods_total{container!=""}[5m]))
            / sum by (namespace, pod, container) (rate(container_cpu_cfs_periods_total{container!=""}[5m]))
            > 0.25
          )
          * on (namespace, pod) group_left ()
          max by (namespace, pod) (kube_pod_labels{label_cnp_3istor_com_role="backing"})
        for: 15m
        labels:
          severity: warning
          cnp_role: backing
        annotations:
          summary: "Backing container {{ $labels.container }} ({{ $labels.namespace }}) is CPU throttled"
          description: "Throttled in {{ $value | humanizePercentage }} of CPU periods in pod {{ $labels.pod }}. Raise its CPU limit."
