# nix shell nixpkgs#prometheus.cli -c promtool test rules backing_test.yaml
rule_files:
  - backing.yaml

evaluation_interval: 1m

tests:
  # db-0 is backing, app-0 is an ordinary app pod with the same symptoms:
  # only db-0 may alert.
  - interval: 1m
    input_series:
      - series: 'kube_pod_labels{namespace="shop-db", pod="db-0", label_cnp_3istor_com_role="backing"}'
        values: '1x40'
      - series: 'kube_pod_labels{namespace="shop-api", pod="app-0"}'
        values: '1x40'
      - series: 'kube_pod_container_status_restarts_total{namespace="shop-db", pod="db-0", container="db"}'
        values: '0 0 1 2 3 4 5x34'
      - series: 'kube_pod_container_status_restarts_total{namespace="shop-api", pod="app-0", container="app"}'
        values: '0 0 1 2 3 4 5x34'
      - series: 'kube_pod_container_status_last_terminated_reason{namespace="shop-db", pod="db-0", container="db", reason="OOMKilled"}'
        values: '0 0 1x38'
      - series: 'kube_pod_container_status_last_terminated_reason{namespace="shop-api", pod="app-0", container="app", reason="OOMKilled"}'
        values: '0 0 1x38'
      - series: 'kube_pod_status_ready{namespace="shop-db", pod="db-0", condition="false"}'
        values: '1x40'
      - series: 'kube_pod_status_ready{namespace="shop-api", pod="app-0", condition="false"}'
        values: '1x40'
      - series: 'kube_pod_spec_volumes_persistentvolumeclaims_info{namespace="shop-db", pod="db-0", persistentvolumeclaim="data-db-0", volume="data"}'
        values: '1x40'
      - series: 'kube_pod_spec_volumes_persistentvolumeclaims_info{namespace="shop-api", pod="app-0", persistentvolumeclaim="uploads", volume="uploads"}'
        values: '1x40'
      - series: 'kubelet_volume_stats_used_bytes{namespace="shop-db", persistentvolumeclaim="data-db-0", node="n1"}'
        values: '85x40'
      - series: 'kubelet_volume_stats_capacity_bytes{namespace="shop-db", persistentvolumeclaim="data-db-0", node="n1"}'
        values: '100x40'
      - series: 'kubelet_volume_stats_used_bytes{namespace="shop-api", persistentvolumeclaim="uploads", node="n1"}'
        values: '85x40'
      - series: 'kubelet_volume_stats_capacity_bytes{namespace="shop-api", persistentvolumeclaim="uploads", node="n1"}'
        values: '100x40'
      - series: 'container_cpu_cfs_periods_total{namespace="shop-db", pod="db-0", container="db"}'
        values: '0+600x40'
      - series: 'container_cpu_cfs_throttled_periods_total{namespace="shop-db", pod="db-0", container="db"}'
        values: '0+300x40'
      - series: 'container_cpu_cfs_periods_total{namespace="shop-api", pod="app-0", container="app"}'
        values: '0+600x40'
      - series: 'container_cpu_cfs_throttled_periods_total{namespace="shop-api", pod="app-0", container="app"}'
        values: '0+300x40'
    alert_rule_test:
      - eval_time: 6m
        alertname: BackingContainerRestarting
        exp_alerts:
          - exp_labels: {severity: warning, cnp_role: backing, namespace: shop-db, pod: db-0, container: db}
            exp_annotations:
              summary: Backing container db (shop-db) keeps restarting
              description: 5 restarts in 15 minutes for pod db-0.
      - eval_time: 30m
        alertname: BackingContainerRestarting
        exp_alerts: []
      - eval_time: 5m
        alertname: BackingContainerOOMKilled
        exp_alerts:
          - exp_labels: {severity: critical, cnp_role: backing, namespace: shop-db, pod: db-0, container: db, reason: OOMKilled}
            exp_annotations:
              summary: Backing container db (shop-db) was OOMKilled
              description: Pod db-0 hit its memory limit in the last 15 minutes. Raise the limit in the app's values or in the CMP.
      - eval_time: 30m
        alertname: BackingContainerOOMKilled
        exp_alerts: []
      - eval_time: 5m
        alertname: BackingPodNotReady
        exp_alerts: []
      - eval_time: 12m
        alertname: BackingPodNotReady
        exp_alerts:
          - exp_labels: {severity: critical, cnp_role: backing, namespace: shop-db, pod: db-0, condition: "false"}
            exp_annotations:
              summary: Backing pod db-0 (shop-db) is not ready
              description: The pod has not been ready for 10 minutes; the apps that depend on it are degraded.
      - eval_time: 20m
        alertname: BackingVolumeAlmostFull
        exp_alerts:
          - exp_labels: {severity: warning, cnp_role: backing, namespace: shop-db, persistentvolumeclaim: data-db-0}
            exp_annotations:
              summary: Volume data-db-0 (shop-db) of a backing container is over 80% full
              description: 85% used.
      - eval_time: 25m
        alertname: BackingContainerCPUThrottled
        exp_alerts:
          - exp_labels: {severity: warning, cnp_role: backing, namespace: shop-db, pod: db-0, container: db}
            exp_annotations:
              summary: Backing container db (shop-db) is CPU throttled
              description: Throttled in 50% of CPU periods in pod db-0. Raise its CPU limit.

  # Healthy backing pod: nothing fires.
  - interval: 1m
    input_series:
      - series: 'kube_pod_labels{namespace="shop-db", pod="db-0", label_cnp_3istor_com_role="backing"}'
        values: '1x40'
      - series: 'kube_pod_container_status_restarts_total{namespace="shop-db", pod="db-0", container="db"}'
        values: '0x40'
      - series: 'kube_pod_container_status_last_terminated_reason{namespace="shop-db", pod="db-0", container="db", reason="OOMKilled"}'
        values: '1x40'
      - series: 'kube_pod_status_ready{namespace="shop-db", pod="db-0", condition="false"}'
        values: '0x40'
      - series: 'kube_pod_spec_volumes_persistentvolumeclaims_info{namespace="shop-db", pod="db-0", persistentvolumeclaim="data-db-0", volume="data"}'
        values: '1x40'
      - series: 'kubelet_volume_stats_used_bytes{namespace="shop-db", persistentvolumeclaim="data-db-0", node="n1"}'
        values: '50x40'
      - series: 'kubelet_volume_stats_capacity_bytes{namespace="shop-db", persistentvolumeclaim="data-db-0", node="n1"}'
        values: '100x40'
      - series: 'container_cpu_cfs_periods_total{namespace="shop-db", pod="db-0", container="db"}'
        values: '0+600x40'
      - series: 'container_cpu_cfs_throttled_periods_total{namespace="shop-db", pod="db-0", container="db"}'
        values: '0+10x40'
    alert_rule_test:
      - {eval_time: 30m, alertname: BackingContainerRestarting, exp_alerts: []}
      - {eval_time: 30m, alertname: BackingContainerOOMKilled, exp_alerts: []}
      - {eval_time: 30m, alertname: BackingPodNotReady, exp_alerts: []}
      - {eval_time: 30m, alertname: BackingVolumeAlmostFull, exp_alerts: []}
      - {eval_time: 30m, alertname: BackingContainerCPUThrottled, exp_alerts: []}
