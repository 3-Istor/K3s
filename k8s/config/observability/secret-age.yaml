# Hourly age of every static secret in Vault's kvv2 mount, pushed to
# VictoriaMetrics as cnp_secret_age_days{path}. Age is the time since the
# current version was written. The Vault role (terraform/roles.tf, secret-age)
# only lists and reads kvv2/metadata: the job never sees a secret value.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-age
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: secret-age-script
data:
  secret_age.py: |
    import datetime
    import json
    import os
    import urllib.error
    import urllib.request

    VAULT = os.environ["VAULT_ADDR"]
    MOUNT = os.environ["KV_MOUNT"]


    def vault(method, path, token=None, body=None):
        req = urllib.request.Request(
            f"{VAULT}/v1/{path}",
            method=method,
            data=json.dumps(body).encode() if body is not None else None,
        )
        if token:
            req.add_header("X-Vault-Token", token)
        with urllib.request.urlopen(req, timeout=10) as resp:
            raw = resp.read()
            return json.loads(raw) if raw else {}


    def walk(token, prefix=""):
        try:
            keys = vault("GET", f"{MOUNT}/metadata/{prefix}?list=true", token)["data"]["keys"]
        except urllib.error.HTTPError as err:
            # An empty folder lists as 404.
            if err.code == 404:
                return
            raise
        for key in keys:
            if key.endswith("/"):
                yield from walk(token, prefix + key)
            else:
                yield prefix + key


    def parse_time(value):
        # Vault writes nanoseconds, which fromisoformat does not take.
        return datetime.datetime.fromisoformat(value.split(".")[0].rstrip("Z") + "+00:00")


    def main():
        with open("/var/run/secrets/kubernetes.io/serviceaccount/token") as f:
            jwt = f.read()
        token = vault("POST", "auth/kubernetes/login", body={"role": os.environ["VAULT_ROLE"], "jwt": jwt})["auth"]["client_token"]
        now = datetime.datetime.now(datetime.timezone.utc)
        lines = ["# TYPE cnp_secret_age_days gauge"]
        try:
            for path in walk(token):
                meta = vault("GET", f"{MOUNT}/metadata/{path}", token)["data"]
                current = meta["versions"][str(meta["current_version"])]
                if current["destroyed"] or current["deletion_time"]:
                    continue
                age = (now - parse_time(current["created_time"])).total_seconds() / 86400
                label = f"{MOUNT}/{path}".replace("\\", "\\\\").replace('"', '\\"')
                lines.append(f'cnp_secret_age_days{{path="{label}"}} {age:.2f}')
        finally:
            vault("POST", "auth/token/revoke-self", token)
        req = urllib.request.Request(os.environ["VMINSERT_URL"], method="POST", data=("\n".join(lines) + "\n").encode())
        urllib.request.urlopen(req, timeout=10).close()
        print(f"pushed the age of {len(lines) - 1} secrets")


    main()
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: secret-age
spec:
  schedule: "23 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: secret-age
        spec:
          restartPolicy: Never
          serviceAccountName: secret-age
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: script
              configMap:
                name: secret-age-script
          containers:
            - name: secret-age
              image: python:3.13.17-alpine
              command: ["python3", "/script/secret_age.py"]
              env:
                - name: VAULT_ADDR
                  value: http://vault.vault.svc.cluster.local:8200
                - name: VAULT_ROLE
                  value: secret-age
                - name: KV_MOUNT
                  value: kvv2
                - name: VMINSERT_URL
                  value: http://vm-victoria-metrics-cluster-vminsert.observability.svc.cluster.local:8480/insert/0/prometheus/api/v1/import/prometheus
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
              volumeMounts:
                - name: script
                  mountPath: /script
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
