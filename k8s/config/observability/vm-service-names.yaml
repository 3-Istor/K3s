# The VictoriaMetrics cluster's Service names, kept after the cluster itself
# was removed (D2): Grafana, Argo Rollouts, OpenCost, the CMP, project Grafana
# orgs (datasources stored in Grafana, not in git), the WireGuard relays and
# secret-age reach VMSingle through them, by way of the compat and projects
# vmauth (vmauth.yaml).
apiVersion: v1
kind: Service
metadata:
  name: vm-victoria-metrics-cluster-vmselect
spec:
  selector:
    app.kubernetes.io/name: vmauth
    app.kubernetes.io/instance: compat
  ports:
    - name: http
      port: 8481
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: vm-victoria-metrics-cluster-vminsert
spec:
  selector:
    app.kubernetes.io/name: vmauth
    app.kubernetes.io/instance: compat
  ports:
    - name: http
      port: 8480
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: vm-victoria-metrics-cluster-vmauth
spec:
  selector:
    app.kubernetes.io/name: vmauth
    app.kubernetes.io/instance: projects
  ports:
    - name: http
      port: 8427
      targetPort: http
