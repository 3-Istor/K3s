apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: observability-secrets
  namespace: observability
spec:
  path: kvv2/observability/config
  vaultRole: observability-role
  type: Opaque
  keys:
    - GRAFANA_ADMIN_PASSWORD
    - OIDC_CLIENT_SECRET
    - DISCORD_WEBHOOK_URL
---
# bcrypt hashes of the Loki gateway's clients.
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: loki-gateway-htpasswd
  namespace: observability
spec:
  path: kvv2/observability/loki-gateway
  vaultRole: observability-role
  type: Opaque
  keys:
    - .htpasswd
---
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: loki-clients
  namespace: observability
spec:
  path: kvv2/observability/loki-clients
  vaultRole: observability-role
  type: Opaque
  keys:
    - ALLOY_LOKI_PASSWORD
    - GRAFANA_LOKI_PASSWORD
    - ARCHIVE_LOKI_PASSWORD
