apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
      # The agentgateway CRDs and their first objects arrive in the same sync.
      - SkipDryRunOnMissingResource=true
  # budget-guard creates and deletes ai-budget-exhausted itself; it is not in
  # Git, so Argo CD neither tracks nor prunes it.
  project: default
  source:
    repoURL: https://github.com/3-Istor/K3s.git
    targetRevision: HEAD
    path: k8s/config/ai-gateway
  destination:
    name: in-cluster
    namespace: ai-gateway
