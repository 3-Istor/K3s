{{- /*
  A release starts when a developer pushes a vX.Y.Z git tag: the app's CI
  publishes the image as X.Y.Z, this updater writes that tag into the app's
  values file, and Argo CD rolls it out with the app's release strategy.
  Semver, not newest-build: branch builds never reach the cluster by themselves.
*/}}
{{- /*
  An app that also runs staging gets a staging updater only: it takes release
  candidates (X.Y.Z-rc.N) into deploy/env/staging/<component>.yaml, and prod
  changes only through a promotion from the CMP, which copies the digest that
  ran in staging. A final X.Y.Z pushed by hand is built but deployed nowhere.
*/}}
{{- range $app := .Values.apps }}
{{- if not (hasKey $app "sourceRevision") }}
{{- $owner := regexReplaceAll "^https://github.com/([^/]+)/.*$" $app.repoURL "${1}" | lower }}
{{- $components := ternary (list "frontend" "backend") (list "app") (eq $app.type "fullstack") }}
{{- $staged := has "staging" ($app.environments | default (list "prod")) }}
{{- range $component := $components }}
{{- $image := printf "ghcr.io/%s/%s%s" $owner ($app.name | lower) (ternary "" (printf "/%s" $component) (eq $component "app")) }}
---
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: {{ printf "%s-%s-%s%s-updater" $.Values.project $app.name $component (ternary "-stg" "" $staged) }}
  namespace: argocd
  labels:
    cnp.3istor.com/project: {{ $.Values.project | quote }}
    cnp.3istor.com/app: {{ $app.name | quote }}
    cnp.3istor.com/env: {{ ternary "staging" "prod" $staged | quote }}
spec:
  applicationRefs:
    - namePattern: {{ printf "%s-%s-%s%s" $.Values.project $app.name $component (ternary "-stg" "" $staged) | quote }}
      images:
        - alias: app-image
          {{- if $staged }}
          {{- /* The -0 lower bound is what lets semver consider pre-releases at all. */}}
          imageName: {{ printf "%s:>=0.0.0-0" $image | quote }}
          {{- else }}
          imageName: {{ $image | quote }}
          {{- end }}
          commonUpdateSettings:
            updateStrategy: semver
            {{- if $staged }}
            allowTags: 'regexp:^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$'
            {{- else }}
            allowTags: 'regexp:^[0-9]+\.[0-9]+\.[0-9]+$'
            {{- end }}
            {{- /* The app's own GHCR pull secret (see image-updater-app-registry RBAC); cloud apps' lives off this cluster, so use the shared one. */}}
            pullSecret: {{ ternary (printf "pullsecret:%s-%s/app-registry" $.Values.project $app.name) "pullsecret:argocd/cnp-cloud-app-registry" (eq $.Values.targetCloud "onprem") | quote }}
          manifestTargets:
            helm:
              name: image.repository
              tag: image.tag
      writeBackConfig:
        method: "git:secret:argocd/cnp-portal-github-creds"
        gitConfig:
          {{- /*
            The Application has two sources: infra-templates (the chart) first,
            then the app repo for $values. Without this the updater writes into
            the first one, the shared chart repo.
          */}}
          repository: {{ $app.repoURL | quote }}
          branch: main
          {{- if $staged }}
          writeBackTarget: {{ printf "helmvalues:/deploy/env/staging/%s.yaml" $component | quote }}
          {{- else }}
          writeBackTarget: {{ printf "helmvalues:/deploy/%s" (ternary "values.yaml" (printf "values-%s.yaml" $component) (eq $component "app")) | quote }}
          {{- end }}
{{- end }}
{{- end }}
{{- end }}
